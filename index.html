:root{
  --bg:#f3efe6; --bg2:#ebe5d8; --card:#fffdf8; --text:#1f1d19; --muted:#7a7568; --line:#ddd6c6;
  --ink:#1f1d19; --ink-fg:#fffdf8; --ans:#f6f1e4;

  --shadow:0 1px 1px rgba(60,45,20,.06),0 8px 24px -8px rgba(60,45,20,.18),0 24px 48px -24px rgba(60,45,20,.18);
  --serif:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}

  :root:not([data-theme="light"]){
    --bg:#15161a; --bg2:#1b1d22; --card:#212329; --text:#ecE8de; --muted:#99968c; --line:#34373f;
    --ink:#ecE8de; --ink-fg:#15161a; --ans:#1a1c21;
    --t1:#79d3b6; --t1bg:#1c3a31; --t2:#9db0f2; --t2bg:#252c4a; --t3:#e8b75d; --t3bg:#3b2f15;
    --good:#6fd39b; --bad:#ff8a73;
    --shadow:0 1px 1px rgba(0,0,0,.4),0 10px 28px -10px rgba(0,0,0,.6);
  }

:root[data-theme="dark"]{
  --bg:#15161a; --bg2:#1b1d22; --card:#212329; --text:#ecE8de; --muted:#99968c; --line:#34373f;
  --ink:#ecE8de; --ink-fg:#15161a; --ans:#1a1c21;
  --t1:#79d3b6; --t1bg:#1c3a31; --t2:#9db0f2; --t2bg:#252c4a; --t3:#e8b75d; --t3bg:#3b2f15;
  --good:#6fd39b; --bad:#ff8a73;
  --shadow:0 1px 1px rgba(0,0,0,.4),0 10px 28px -10px rgba(0,0,0,.6);

*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:16px/1.65 var(--sans);overflow-x:hidden;
  background-image:radial-gradient(1200px 600px at 10% -10%,var(--bg2),transparent 60%),radial-gradient(900px 500px at 100% 110%,var(--bg2),transparent 60%);
  background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:0;padding:0}
.app{display:flex;flex-direction:column;height:100dvh;max-width:1120px;margin:0 auto;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
/* header */
.top{display:flex;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top,0px)) 0 8px;flex:none}
.brand{font:700 19px/1 var(--serif);letter-spacing:.04em;flex:1;white-space:nowrap}
.brand small{display:block;font:500 11px/1.4 var(--sans);color:var(--muted);letter-spacing:.12em;margin-top:4px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:6px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);min-height:34px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--ink-fg)}
.ibtn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.ibtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.ibtn .dot{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/17px var(--sans);text-align:center;padding:0 4px}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;flex:none}
.prog i{display:block;height:100%;width:0;background:var(--good);transition:width .35s}
.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}
/* swipe view */
.meta2{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);padding:10px 2px 6px;flex:none}
.meta2 b{color:var(--text);font-variant-numeric:tabular-nums}
.stage{flex:1;min-height:0;position:relative;padding:4px 0 8px;display:flex}
.stage::before{display:none;content:"";position:absolute;inset:14px 14px 0;border-radius:24px;background:var(--card);opacity:.55;border:1px solid var(--line);transform:translateY(8px) scale(.97);z-index:0}
.scard{position:relative;z-index:1;flex:1;min-width:0;align-self:flex-start;max-height:100%;min-height:min(100%,440px);background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
  overflow:hidden;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  animation:enter .28s cubic-bezier(.2,.8,.2,1)}
.scard.dragging{animation:none;transition:none;cursor:grabbing}
.scard.fly{transition:transform .26s ease-in,opacity .26s ease-in;opacity:0}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.bar{height:6px;flex:none}
.bar.t1{background:var(--t1)}.bar.t2{background:var(--t2)}.bar.t3{background:var(--t3)}
.bigno{position:absolute;right:18px;top:6px;font:700 96px/1 var(--serif);color:var(--text);opacity:.055;pointer-events:none}
.cbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 22px 22px;position:relative;-webkit-overflow-scrolling:touch}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:14px;position:relative}
.tag{padding:2px 10px;border-radius:999px;font-weight:700;font-size:12px;letter-spacing:.06em}
.tag.t1{background:var(--t1bg);color:var(--t1)}.tag.t2{background:var(--t2bg);color:var(--t2)}.tag.t3{background:var(--t3bg);color:var(--t3)}
.sq{font:700 clamp(20px,4.6vw,27px)/1.6 var(--serif);position:relative;letter-spacing:.01em}
.sq p{margin:0}
.hintline{display:flex;align-items:center;gap:10px;margin:22px 0 4px;color:var(--muted);font-size:13px}
.hintline::before,.hintline::after{content:"";flex:1;height:1px;background:var(--line)}
.sa{display:none;margin-top:18px;padding:16px 18px;background:var(--ans);border-radius:16px;border:1px solid var(--line);font-size:16.5px;line-height:1.75;user-select:text;-webkit-user-select:text}
.scard.open .sa{display:block;animation:rise .25s ease-out}
.scard.open .hintline{display:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sa p{margin:.3em 0}.sa ul,.sa ol{margin:.35em 0;padding-left:1.4em}.sa li{margin:.2em 0}
.sa .katex-display{margin:.6em 0;overflow-x:auto;overflow-y:hidden}
.stamp{position:absolute;top:26px;z-index:3;font:700 22px/1 var(--serif);letter-spacing:.1em;padding:8px 14px;border:3px solid;border-radius:10px;opacity:0;pointer-events:none}
.stamp.g{left:20px;color:var(--good);transform:rotate(-12deg)}
.stamp.b{right:20px;color:var(--bad);transform:rotate(12deg)}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.badge.m1{background:var(--good);color:#fff}.badge.m2{background:var(--bad);color:#fff}
.ctrls{flex:none;display:grid;grid-template-columns:auto 1fr 1fr;grid-template-areas:"prev reveal reveal" "bad bad good";gap:10px;padding:6px 0 max(14px,env(safe-area-inset-bottom,0px))}
.ctrls .prev{grid-area:prev}.ctrls .reveal{grid-area:reveal}
.ctrls .bad{grid-area:bad}.ctrls .good{grid-area:good}
.cbtn{min-height:52px;border-radius:16px;font-weight:700;font-size:16px;border:1.5px solid var(--line);background:var(--card);padding:0 18px;display:flex;align-items:center;justify-content:center;gap:8px}
.cbtn:active{transform:scale(.97)}
.cbtn.reveal{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.cbtn.bad{color:var(--bad);border-color:var(--bad)}
.cbtn.good{color:var(--good);border-color:var(--good)}
.cbtn.bad:active{background:var(--bad);color:#fff}.cbtn.good:active{background:var(--good);color:#fff}
.cbtn.prev{width:52px;padding:0}
.kbd{display:none;font-size:12px;color:var(--muted);text-align:center;padding-bottom:10px}
@media (hover:hover) and (min-width:760px){.kbd{display:block}}
@media (min-width:760px){
  .stage{justify-content:center}.scard{max-width:760px}.stage::before{max-width:720px;margin:0 auto}
  .ctrls{max-width:760px;width:100%;margin:0 auto}
}
/* end / empty */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px}
.center h2{font:700 28px/1.3 var(--serif);margin:0}
.center p{color:var(--muted);margin:0}
.stats3{display:flex;gap:10px;margin:10px 0}
.stats3 div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 18px;min-width:84px}
.stats3 b{display:block;font:700 26px/1.2 var(--serif)}
.stats3 span{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:0 18px;min-height:46px;font-weight:600;font-size:15px}
.btn.pri{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
/* list view */
.lbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 0 10px;flex:none}
.lbar .btn{min-height:40px;font-size:14px;padding:0 14px}
.lbar .stat{margin-left:auto;font-size:13px;color:var(--muted)}
.lscroll{flex:1;min-height:0;overflow-y:auto;padding:2px 0 96px;-webkit-overflow-scrolling:touch}
#list{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:760px){#list{grid-template-columns:1fr 1fr;gap:14px}}
.lc{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;align-self:start;position:relative}
.lc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.lc.t1::before{background:var(--t1)}.lc.t2::before{background:var(--t2)}.lc.t3::before{background:var(--t3)}
.lc .qbtn{display:block;width:100%;text-align:left;padding:14px 16px 14px 20px}
.lc .q{font:700 17px/1.6 var(--serif)}.lc .q p{margin:0}
.lc .meta{margin-bottom:8px}
.lc .hint{font-size:12px;color:var(--muted);margin-top:6px}
.lc .a{display:none;background:var(--ans);border-top:1px dashed var(--line);padding:12px 16px 14px 20px;font-size:15.5px}
.lc.open .a{display:block}.lc.open .hint{display:none}
.lc .a p{margin:.25em 0}.lc .a ul,.lc .a ol{margin:.3em 0;padding-left:1.35em}.lc .a li{margin:.15em 0}
.lc .a .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden}
.lc .marks{display:flex;gap:8px;margin-top:10px}
.lc .marks button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:42px;font-size:14px;font-weight:600}
.lc .marks .g[aria-pressed="true"]{background:var(--good);color:#fff;border-color:var(--good)}
.lc .marks .b[aria-pressed="true"]{background:var(--bad);color:#fff;border-color:var(--bad)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:30;display:none;
  border-radius:999px;padding:0 22px;min-height:50px;font-weight:700;font-size:15px;background:var(--ink);color:var(--ink-fg);box-shadow:0 8px 20px rgba(0,0,0,.3)}
body.list .fab{display:block}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,8,4,.45);z-index:50;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:26px 26px 0 0;border:1px solid var(--line);
  padding:18px max(20px,env(safe-area-inset-right,0px)) max(22px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:86dvh;overflow-y:auto;margin:0 auto;max-width:640px}
.sheet.on{transform:none}
.sheet h3{font:700 20px/1.3 var(--serif);margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
.sheet .sub{font-size:13px;color:var(--muted);margin-bottom:6px}
.fg{margin:14px 0}.fg .lab{font-size:12.5px;color:var(--muted);letter-spacing:.1em;margin-bottom:8px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 15px;font-size:14.5px;min-height:38px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.tg{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-weight:600}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-checked="true"]{background:var(--good)}.sw[aria-checked="true"]::after{transform:translateX(20px)}
.sheet .row{margin-top:14px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:10px 0}
</style>

<script>
const CARDS = [{"ch": 1, "tier": "基础", "topic": "绪论", "q": "计量经济学研究什么？核心任务是什么？", "a": "用统计方法 + 经济理论 + 数据，**估计经济关系、检验经济假说、做预测与政策评估**。\n- 核心：把经济问题写成可估计的模型，再用数据回答\"某变量对另一变量的**因果**影响有多大\"。", "id": "e523f1f8"}, {"ch": 1, "tier": "基础", "topic": "数据类型", "q": "四种常见数据结构分别是什么？各举一例。", "a": "- **横截面数据**：同一时点、不同个体（某年 500 个工人的工资与教育）\n- **时间序列数据**：同一个体、不同时点（某国 1990–2020 年 GDP）\n- **混合横截面**：不同时点各自独立抽样的横截面合并（两年各抽一批家庭）\n- **面板（纵向）数据**：**同一批**个体、多个时点（同一批企业连续 10 年）", "id": "ca889169"}, {"ch": 1, "tier": "基础", "topic": "因果", "q": "相关和因果的区别是什么？为什么回归系数不自动等于因果效应？", "a": "相关只说明两变量一起变动；因果说明**改变 x 会导致 y 改变**。\n- 回归系数只在\"其他影响 y 的因素与 x 无关\"时才能当因果效应；否则存在遗漏变量、反向因果、测量误差等**内生性**问题。", "id": "acf5e16d"}, {"ch": 1, "tier": "基础", "topic": "ceteris paribus", "q": "ceteris paribus（其他条件不变）是什么意思？多元回归怎么做到？", "a": "比较时让**其他影响 y 的因素保持不变**，只看 x 变化的影响。\n- 多元回归把这些因素作为控制变量放进模型，系数解释为\"控制其余变量后\"的偏效应。\n- 关键：只能控制**放进模型/可观测**的变量。", "id": "6fb54925"}, {"ch": 1, "tier": "基础", "topic": "经验分析步骤", "q": "一项经验研究的基本步骤是什么？", "a": "提出问题 → 经济模型 → 设定计量模型（含误差项 u）→ 收集数据 → 估计 → 假设检验/稽核 → 解释、预测与政策建议。", "id": "b6d73704"}, {"ch": 1, "tier": "基础", "topic": "误差项", "q": "计量模型里为什么要有误差项 u？它包含哪些东西？", "a": "现实中 y 不只由我们列出的 x 决定。u 包含：\n- 遗漏的、不可观测的因素\n- 测量误差\n- 函数形式设定的偏差\n- 纯随机性", "id": "834410f6"}, {"ch": 1, "tier": "进阶", "topic": "实验与观测数据", "q": "实验数据与观测（非实验）数据的主要区别？为什么实验数据更容易识别因果？", "a": "实验中**随机分配**处理，使处理变量与其他因素（u）独立，所以简单比较均值就是因果效应；观测数据中个体自己选择 x，x 与 u 往往相关，需要控制变量或其他识别策略。", "id": "2a6d3cab"}, {"ch": 1, "tier": "进阶", "topic": "参数线性", "q": "\"线性回归模型\"的\"线性\"指的是什么？$y=\\beta_0+\\beta_1x^2+u$ 是线性模型吗？", "a": "指对**参数**线性，对变量形式不限。所以 $y=\\beta_0+\\beta_1x^2+u$ 与 $\\log y=\\beta_0+\\beta_1\\log x+u$ 都是线性回归模型，仍可用 OLS；$y=\\beta_0+x^{\\beta_1}+u$ 则不是。", "id": "c343322c"}, {"ch": 1, "tier": "进阶", "topic": "好的估计与解释", "q": "老师强调的\"好的估计\"和\"好的解释\"是什么关系？", "a": "先是估计阶段：想办法让系数无偏/一致（控制变量、识别策略）；估计出来后是解释阶段：**紧扣变量本身**来讲故事，不能把没控制好的东西（如年龄）当成解释。", "id": "8358bc0d"}, {"ch": 1, "tier": "少见", "topic": "偏误方向判断", "q": "遗漏变量 z 与 y 正相关、与 x 负相关，则 x 的系数偏误方向？如果真实 $\\beta_1<0$，对\"效应大小\"意味着什么？", "a": "偏误符号 = (z 对 y 的符号) × (z 与 x 相关的符号) = (+)×(−) = **负**，估计值**偏小**。\n- 注意\"数值偏小\"≠\"效应被低估\"：若 $\\beta_1<0$，数值更负意味着**负效应的幅度被高估**。区分数值和效应大小。", "id": "41ba92b3"}, {"ch": 2, "tier": "基础", "topic": "简单回归模型", "q": "写出简单回归模型，并说明各符号含义。", "a": "$$y=\\beta_0+\\beta_1x+u$$\n- $y$：因变量/被解释变量；$x$：自变量/解释变量\n- $\\beta_1$：斜率，$x$ 增加 1 单位，$y$ 变化 $\\beta_1$（需 $\\Delta u=0$）\n- $\\beta_0$：截距；$u$：误差项（其他因素）", "id": "5b8e7c5e"}, {"ch": 2, "tier": "基础", "topic": "SLR假定", "q": "简单回归的五条假定 SLR.1–SLR.5 分别是什么？", "a": "- **SLR.1** 参数线性：$y=\\beta_0+\\beta_1x+u$\n- **SLR.2** 随机抽样：$(x_i,y_i)$ 独立同分布\n- **SLR.3** 样本中 $x$ 有变异（不全相等）\n- **SLR.4** 零条件均值：$E(u|x)=0$\n- **SLR.5** 同方差：$Var(u|x)=\\sigma^2$", "id": "c720ee49"}, {"ch": 2, "tier": "基础", "topic": "零条件均值", "q": "$E(u|x)=0$ 是什么意思？违反时会怎样？", "a": "无论 x 取什么值，不可观测因素 u 的平均值都是 0，即 **u 与 x 无关（均值意义上）**。\n- 违反（如能力同时影响教育和工资）→ OLS **有偏**。是\"无偏性\"最关键的假定。", "id": "bd0b2b6b"}, {"ch": 2, "tier": "基础", "topic": "E(u)=0", "q": "为什么可以假定 $E(u)=0$？它损失一般性吗？", "a": "不损失。只要截距 $\\beta_0$ 在模型里，总可以把 u 的均值吸收到 $\\beta_0$ 里。真正有内容的是\"**u 与 x 的关系**\"（SLR.4）。", "id": "9c6a7c8f"}, {"ch": 2, "tier": "基础", "topic": "OLS目标", "q": "OLS 的思想是什么？目标函数是什么？", "a": "选 $\\hat\\beta_0,\\hat\\beta_1$ 使**残差平方和最小**：\n$$\\min \\sum_{i=1}^n(y_i-\\hat\\beta_0-\\hat\\beta_1x_i)^2$$", "id": "4153b632"}, {"ch": 2, "tier": "基础", "topic": "OLS公式", "q": "写出简单回归 OLS 的 $\\hat\\beta_1$ 与 $\\hat\\beta_0$。", "a": "$$\\hat\\beta_1=\\frac{\\sum(x_i-\\bar x)(y_i-\\bar y)}{\\sum(x_i-\\bar x)^2}=\\frac{\\widehat{Cov}(x,y)}{\\widehat{Var}(x)},\\qquad \\hat\\beta_0=\\bar y-\\hat\\beta_1\\bar x$$", "id": "79130e0f"}, {"ch": 2, "tier": "基础", "topic": "一阶条件", "q": "OLS 的两个一阶条件（正规方程）是什么？", "a": "$$\\sum(y_i-\\hat\\beta_0-\\hat\\beta_1x_i)=0,\\qquad \\sum x_i(y_i-\\hat\\beta_0-\\hat\\beta_1x_i)=0$$\n即 $\\sum\\hat u_i=0$，$\\sum x_i\\hat u_i=0$。", "id": "5160fc85"}, {"ch": 2, "tier": "基础", "topic": "代数性质", "q": "OLS 残差与拟合值的三条代数性质？", "a": "1. $\\sum\\hat u_i=0$（残差和为 0）\n2. $\\sum x_i\\hat u_i=0$（残差与 x 样本不相关）\n3. 回归线过样本均值点 $(\\bar x,\\bar y)$\n- 另：$\\sum\\hat y_i\\hat u_i=0$。这些是**代数事实**，不依赖任何统计假定。", "id": "a3c28b37"}, {"ch": 2, "tier": "基础", "topic": "总体vs样本", "q": "总体回归函数（PRF）和样本回归函数（SRF）的区别？", "a": "PRF：$E(y|x)=\\beta_0+\\beta_1x$，参数是**未知常数**；SRF：$\\hat y=\\hat\\beta_0+\\hat\\beta_1x$，系数是用样本算出来的**随机变量**（换个样本就变）。", "id": "933cd49b"}, {"ch": 2, "tier": "基础", "topic": "平方和分解", "q": "SST、SSE、SSR 各是什么？它们的关系？", "a": "- SST $=\\sum(y_i-\\bar y)^2$：总平方和（y 的总变异）\n- SSE $=\\sum(\\hat y_i-\\bar y)^2$：解释（Explained）平方和\n- SSR $=\\sum\\hat u_i^2$：残差（Residual）平方和\n- **SST = SSE + SSR**（SSE 的 E 是 Explained，SSR 的 R 是 Residual；注意有些书记号相反）", "id": "cd9c9971"}, {"ch": 2, "tier": "基础", "topic": "R²", "q": "$R^2$ 的定义、含义、取值范围？", "a": "$$R^2=\\frac{SSE}{SST}=1-\\frac{SSR}{SST}\\in[0,1]$$\ny 的样本变异中被回归（x）解释的比例。\n- 简单回归中 $R^2=[corr(x,y)]^2$。\n- **高 $R^2$ 不等于因果**，低 $R^2$ 也不代表系数没意义。", "id": "a55e9ea6"}, {"ch": 2, "tier": "基础", "topic": "单位变化", "q": "y 或 x 乘以常数 c，$\\hat\\beta_1$、$\\hat\\beta_0$、$R^2$ 怎么变？", "a": "- y×c：$\\hat\\beta_0,\\hat\\beta_1$ 都 ×c\n- x×c：$\\hat\\beta_1$ ÷c，$\\hat\\beta_0$ 不变\n- $R^2$ **都不变**（以及 t、p 值也不变）", "id": "185f0c7a"}, {"ch": 2, "tier": "基础", "topic": "对数形式", "q": "四种函数形式的系数怎么解释？", "a": "- 水平-水平：x +1 单位，y 变 $\\beta_1$ 单位\n- 对数-水平 $\\log y\\sim x$：x +1 单位，y 约变 $100\\beta_1\\%$（半弹性）\n- 水平-对数 $y\\sim\\log x$：x 增 1%，y 约变 $\\beta_1/100$ 单位\n- 对数-对数：x 增 1%，y 约变 $\\beta_1\\%$（**弹性**）", "id": "d9aeb7ab"}, {"ch": 2, "tier": "基础", "topic": "无偏性", "q": "无偏性的含义？需要哪些假定？", "a": "$E(\\hat\\beta_1)=\\beta_1$：重复抽很多样本，估计值**平均**等于真值。需要 SLR.1–SLR.4。\n- 无偏性是**估计量（方法）**的性质，不是某一次估计值的性质；不保证具体一次接近真值。", "id": "c28c9e77"}, {"ch": 2, "tier": "基础", "topic": "无偏性证明", "q": "推导 $\\hat\\beta_1$ 的无偏性（关键步骤）。", "a": "1. $\\hat\\beta_1=\\dfrac{\\sum(x_i-\\bar x)y_i}{\\sum(x_i-\\bar x)^2}$（因为 $\\sum(x_i-\\bar x)=0$）\n2. 代入**真实模型** $y_i=\\beta_0+\\beta_1x_i+u_i$（不是带 hat 的）：\n$$\\hat\\beta_1=\\beta_1+\\frac{\\sum(x_i-\\bar x)u_i}{\\sum(x_i-\\bar x)^2}$$\n3. 条件于 X 取期望，$E(u_i|X)=0$（SLR.4）→ $E(\\hat\\beta_1|X)=\\beta_1$。", "id": "1dbc5921"}, {"ch": 2, "tier": "基础", "topic": "方差", "q": "写出 $Var(\\hat\\beta_1)$，并说明什么情况下方差更小。", "a": "$$Var(\\hat\\beta_1|X)=\\frac{\\sigma^2}{\\sum(x_i-\\bar x)^2}=\\frac{\\sigma^2}{SST_x}$$\n- 误差方差 $\\sigma^2$ 小 → 更准\n- x 的变异大（$SST_x$ 大）、样本量 n 大 → 更准\n- 需要 SLR.1–SLR.5（同方差）", "id": "852a4b1f"}, {"ch": 2, "tier": "基础", "topic": "σ²估计", "q": "$\\sigma^2$ 怎么估计？为什么除以 $n-2$？", "a": "$$\\hat\\sigma^2=\\frac{SSR}{n-2}$$\nOLS 的两个一阶条件给残差加了 2 个线性约束，只有 $n-2$ 个自由度；除以 $n-2$ 使 $\\hat\\sigma^2$ **无偏**。$\\hat\\sigma=\\sqrt{\\hat\\sigma^2}$ 称回归标准误（SER）。", "id": "2b0f3ecb"}, {"ch": 2, "tier": "基础", "topic": "标准误", "q": "$se(\\hat\\beta_1)$ 的公式？", "a": "$$se(\\hat\\beta_1)=\\frac{\\hat\\sigma}{\\sqrt{\\sum(x_i-\\bar x)^2}}$$\n用 $\\hat\\sigma$ 代替未知的 $\\sigma$。", "id": "3c17c70a"}, {"ch": 2, "tier": "进阶", "topic": "同方差", "q": "同方差假定（SLR.5）是否影响无偏性？违反时会怎样？", "a": "**不影响无偏性**（无偏性只用 SLR.1–4）。违反（异方差）时：公式 $Var=\\sigma^2/SST_x$ 不再对，常规 se、t、F 失效；OLS 不再是 BLUE。", "id": "9416dd3d"}, {"ch": 2, "tier": "进阶", "topic": "随机x", "q": "为什么证明里要\"条件于 X\"？", "a": "先把抽到的这一批 x 固定下来，再看 $\\hat\\beta_1$ 平均落在哪；这样含 x 的项可当常数提出期望号外，只剩 $E(u|X)$。", "id": "9edd5d53"}, {"ch": 2, "tier": "进阶", "topic": "SLR.3", "q": "如果样本中所有 $x_i$ 都相同会怎样？", "a": "$\\sum(x_i-\\bar x)^2=0$，$\\hat\\beta_1$ 分母为 0，**无法估计**。所以需要 x 有样本变异（SLR.3）。", "id": "1dc877c6"}, {"ch": 2, "tier": "进阶", "topic": "扩大样本", "q": "零条件均值被违反时，增大样本能解决吗？", "a": "不能。这是模型设定/内生性问题，不是样本量问题；样本再大，估计仍有偏（大样本下是不一致）。", "id": "b17d5062"}, {"ch": 2, "tier": "进阶", "topic": "二元x", "q": "x 是 0/1 虚拟变量时，$\\hat\\beta_1$ 是什么？", "a": "$\\hat\\beta_1=\\bar y_{x=1}-\\bar y_{x=0}$（两组样本均值之差），$\\hat\\beta_0=\\bar y_{x=0}$。", "id": "3b9f2916"}, {"ch": 2, "tier": "进阶", "topic": "β1的另一种写法", "q": "$\\hat\\beta_1$ 与相关系数的关系？", "a": "$$\\hat\\beta_1=\\hat\\rho_{xy}\\cdot\\frac{\\hat\\sigma_y}{\\hat\\sigma_x}$$\n所以 $\\hat\\beta_1$ 与相关系数同号；$R^2=\\hat\\rho^2$。", "id": "4d125392"}, {"ch": 2, "tier": "进阶", "topic": "β0无偏", "q": "如何证明 $\\hat\\beta_0$ 无偏？", "a": "$\\hat\\beta_0=\\bar y-\\hat\\beta_1\\bar x=\\beta_0+(\\beta_1-\\hat\\beta_1)\\bar x+\\bar u$，取条件期望，利用 $E(\\hat\\beta_1)=\\beta_1$、$E(u|X)=0$ 得 $E(\\hat\\beta_0)=\\beta_0$。", "id": "8b76935c"}, {"ch": 2, "tier": "进阶", "topic": "过原点回归", "q": "过原点回归 $y=\\beta_1x+u$ 的 OLS 估计量？与带截距有何不同？", "a": "$$\\tilde\\beta_1=\\frac{\\sum x_iy_i}{\\sum x_i^2}$$\n- 残差之和**不再保证为 0**（只有 $\\sum x_i\\hat u_i=0$ 这一个一阶条件）。\n- 若真实截距 $\\beta_0\\ne0$，则 $\\tilde\\beta_1$ 有偏；$R^2$ 可能为负/不可与带截距比较。", "id": "849ec6e"}, {"ch": 2, "tier": "少见", "topic": "SST=SSE+SSR证明", "q": "证明 $SST=SSE+SSR$。", "a": "$y_i-\\bar y=(y_i-\\hat y_i)+(\\hat y_i-\\bar y)=\\hat u_i+(\\hat y_i-\\bar y)$，两边平方求和：\n$$SST=SSR+SSE+2\\sum\\hat u_i(\\hat y_i-\\bar y)$$\n交叉项 $=2\\sum\\hat u_i\\hat y_i-2\\bar y\\sum\\hat u_i=0$（残差与拟合值不相关、残差和为 0），故成立。**需要模型含截距**。", "id": "396399ed"}, {"ch": 2, "tier": "少见", "topic": "无截距的R²", "q": "为什么过原点回归的 $R^2$ 不能直接用 $1-SSR/SST$？", "a": "无截距时 $\\sum\\hat u_i\\ne0$，SST=SSE+SSR **不再成立**，$1-SSR/SST$ 可能为负，不能与带截距模型比较。", "id": "7658ad3"}, {"ch": 2, "tier": "少见", "topic": "半弹性近似", "q": "$\\log(wage)=\\beta_0+\\beta_1educ$：$100\\beta_1\\%$ 是精确还是近似？", "a": "近似（一阶近似，$\\beta_1\\Delta x$ 越接近 0 越准）。精确是 $100(e^{\\beta_1\\Delta x}-1)\\%$。", "id": "d9da7ed1"}, {"ch": 2, "tier": "少见", "topic": "改变单位对se", "q": "改变单位时，$se(\\hat\\beta_1)$ 的变化规律？", "a": "与 $\\hat\\beta_1$ **同比例**变：y×c → se ×c；x×c → se ÷c。所以 $t=\\hat\\beta_1/se$ 不变。", "id": "564cb8ef"}, {"ch": 3, "tier": "基础", "topic": "MLR模型", "q": "写出含 k 个自变量的多元回归模型。多元回归比简单回归好在哪？", "a": "$$y=\\beta_0+\\beta_1x_1+\\cdots+\\beta_kx_k+u$$\n- 可以**控制**其他因素，更接近 ceteris paribus；\n- 把原先在 u 里、与 x 相关的变量拿出来，减少遗漏变量偏误；\n- 可以加入非线性项（平方、交互），拟合更好。", "id": "89c0ea4e"}, {"ch": 3, "tier": "基础", "topic": "系数含义", "q": "多元回归中 $\\beta_j$ 的含义？", "a": "**保持其他自变量不变**，$x_j$ 增加 1 单位时 y 的平均变化（偏效应）：$\\beta_j=\\partial y/\\partial x_j$。", "id": "9fc5ffc6"}, {"ch": 3, "tier": "基础", "topic": "MLR假定", "q": "MLR.1–MLR.5 分别是什么？", "a": "- **MLR.1** 参数线性\n- **MLR.2** 随机抽样\n- **MLR.3** 无完全共线性（自变量之间无完全线性关系，且每个有变异）\n- **MLR.4** 零条件均值 $E(u|x_1,\\dots,x_k)=0$\n- **MLR.5** 同方差 $Var(u|x_1,\\dots,x_k)=\\sigma^2$\n- 另：MLR.6 正态性 $u\\sim N(0,\\sigma^2)$（第4章用）", "id": "77c1893b"}, {"ch": 3, "tier": "基础", "topic": "MLR.3", "q": "完全共线性是什么？会导致什么？举例。", "a": "某个自变量是其他自变量的**严格**线性组合（如 $x_3=2x_1+x_2$；同时放入\"男\"\"女\"两个虚拟变量和截距）。此时 OLS 无法唯一确定系数，**软件会自动剔除一个**。\n- 只是\"高度相关\"不违反 MLR.3。", "id": "98f62315"}, {"ch": 3, "tier": "基础", "topic": "OLS一阶条件", "q": "多元回归 OLS 一阶条件是什么？", "a": "对 $\\beta_0,\\dots,\\beta_k$ 求偏导得 $k+1$ 个方程：\n$$\\sum\\hat u_i=0,\\quad \\sum x_{ij}\\hat u_i=0\\ (j=1,\\dots,k)$$\n残差与每个自变量样本不相关。", "id": "2cd3c3e4"}, {"ch": 3, "tier": "基础", "topic": "拟合性质", "q": "多元回归 OLS 的代数性质？", "a": "1. 残差和为 0\n2. 残差与每个 $x_j$ 样本不相关（也与 $\\hat y$ 不相关）\n3. 回归超平面过 $(\\bar y,\\bar x_1,\\dots,\\bar x_k)$\n4. $SST=SSE+SSR$", "id": "52f735eb"}, {"ch": 3, "tier": "基础", "topic": "R²不减", "q": "加入新变量，$R^2$ 会怎样？为什么？", "a": "**不会下降**（几乎总是上升）。因为多一个变量，最小化的范围更大，SSR 只会不增，所以 $R^2=1-SSR/SST$ 不降。所以要看调整 $R^2$ 或检验。", "id": "bebdc1c7"}, {"ch": 3, "tier": "基础", "topic": "偏回归的含义(两步法)", "q": "用两步法（Frisch–Waugh）说明 $\\hat\\beta_1$ 的含义。", "a": "1. 把 $x_1$ 对其他所有自变量回归，取残差 $\\tilde r_1$（$x_1$ 中**与其他 x 无关的部分**）\n2. 把 y 对 $\\tilde r_1$ 回归，斜率就是 $\\hat\\beta_1$：\n$$\\hat\\beta_1=\\frac{\\sum\\tilde r_{i1}y_i}{\\sum\\tilde r_{i1}^2}$$\n即 $\\hat\\beta_1$ 只用 $x_1$ 中\"被其他变量剔除后\"的变异。", "id": "2a0af0f8"}, {"ch": 3, "tier": "基础", "topic": "简单回归vs多元回归", "q": "什么时候简单回归的 $\\tilde\\beta_1$ 与多元回归的 $\\hat\\beta_1$ 相等？", "a": "(1) $x_2$ 的偏效应 $\\hat\\beta_2=0$；或 (2) $x_1$ 与 $x_2$ 样本无关。两者之一成立时二者相等。一般关系：$\\tilde\\beta_1=\\hat\\beta_1+\\hat\\beta_2\\tilde\\delta_1$。", "id": "dd4419ed"}, {"ch": 3, "tier": "基础", "topic": "遗漏变量偏误", "q": "真实模型 $y=\\beta_0+\\beta_1x_1+\\beta_2x_2+u$，漏掉 $x_2$ 只回归 $y$ 对 $x_1$，偏误是多少？", "a": "设 $x_2=\\delta_0+\\delta_1x_1+v$，则\n$$E(\\tilde\\beta_1)=\\beta_1+\\beta_2\\delta_1,\\qquad Bias=\\beta_2\\delta_1$$\n无偏当且仅当 $\\beta_2=0$ 或 $\\delta_1=0$（遗漏变量不影响 y，或与 $x_1$ 无关）。", "id": "b0b5735"}, {"ch": 3, "tier": "基础", "topic": "偏误符号表", "q": "遗漏变量偏误方向怎么判断？", "a": "偏误符号 = $\\beta_2$ 的符号 × $\\delta_1$ 的符号（$\\delta_1$ 即遗漏变量与 $x_1$ 的相关符号）：\n- (+)(+)=正偏；(−)(−)=正偏\n- (+)(−)=负偏；(−)(+)=负偏\n- 正偏 = 估计值偏大，负偏 = 估计值偏小（数值上）。", "id": "9a770808"}, {"ch": 3, "tier": "基础", "topic": "无偏性MLR", "q": "多元回归 OLS 无偏性需要哪些假定？", "a": "MLR.1–MLR.4。同方差（MLR.5）不影响无偏性。", "id": "595ad7c7"}, {"ch": 3, "tier": "基础", "topic": "方差公式", "q": "写出 $Var(\\hat\\beta_j)$，解释各因素的作用。", "a": "$$Var(\\hat\\beta_j)=\\frac{\\sigma^2}{SST_j(1-R_j^2)}$$\n- $\\sigma^2$ 大 → 方差大\n- $SST_j$（$x_j$ 的总变异）大 → 方差小，n 大也使其变大\n- $R_j^2$：$x_j$ 对其他自变量回归的 $R^2$。越大（共线性越强）→ 方差越大\n- 需要 MLR.1–5。", "id": "a6168957"}, {"ch": 3, "tier": "基础", "topic": "多重共线性", "q": "多重共线性是什么？有什么后果？是否违反假定？", "a": "自变量之间高度（不是完全）相关，$R_j^2\\to1$。\n- **不违反**任何假定，OLS 仍然无偏、仍是 BLUE；\n- 但 $Var(\\hat\\beta_j)$ 变大，se 变大，t 变小，不易显著；\n- 只影响相关的那几个变量，其他变量的系数不受影响。", "id": "e5a28bb0"}, {"ch": 3, "tier": "基础", "topic": "VIF", "q": "VIF 是什么？怎么判断共线性严重？", "a": "$VIF_j=\\dfrac1{1-R_j^2}$，方差被放大的倍数。常用经验规则 VIF>10 认为严重（只是经验，没有严格标准）。", "id": "6bb01d8"}, {"ch": 3, "tier": "基础", "topic": "σ²估计", "q": "多元回归中 $\\hat\\sigma^2$ 怎么算？自由度是多少？", "a": "$$\\hat\\sigma^2=\\frac{SSR}{n-k-1}$$\n自由度 $n-k-1$（$k+1$ 个参数，$k+1$ 个一阶条件约束）；MLR.1–5 下无偏。", "id": "c7e6336d"}, {"ch": 3, "tier": "基础", "topic": "se公式", "q": "$se(\\hat\\beta_j)$ 公式？", "a": "$$se(\\hat\\beta_j)=\\frac{\\hat\\sigma}{\\sqrt{SST_j(1-R_j^2)}}$$", "id": "4f6c8687"}, {"ch": 3, "tier": "基础", "topic": "高斯-马尔可夫", "q": "高斯-马尔可夫定理的内容？", "a": "在 MLR.1–MLR.5 下，OLS 估计量是**最优线性无偏估计量（BLUE）**：在所有\"y 的线性且无偏\"的估计量中方差最小。\n- 缺任何一条，结论不一定成立（异方差下 OLS 不再 BLUE，但仍无偏）。", "id": "5d453afa"}, {"ch": 3, "tier": "基础", "topic": "变量取舍", "q": "加入无关变量（真实系数为 0）和遗漏相关变量，分别有什么后果？", "a": "- **多放无关变量**：不影响无偏性，但可能增大方差（若与别的 x 相关）\n- **漏掉相关变量**：一般有偏（遗漏变量偏误），但方差可能更小\n- 权衡：偏误 vs 方差。", "id": "46e103da"}, {"ch": 3, "tier": "进阶", "topic": "包含变量的偏方差权衡", "q": "遗漏一个变量导致有偏，为什么有时仍有人这么做？", "a": "因为估计量方差可能更小（少了共线性）。若遗漏变量与 $x_1$ 无关（$\\delta_1=0$），遗漏则无偏且方差不变；一般要权衡偏误与方差。", "id": "925c5dce"}, {"ch": 3, "tier": "进阶", "topic": "两步法证明", "q": "为什么两步法得到的就是 $\\hat\\beta_1$？思路？", "a": "一阶条件说明 $x_1$ 的残差 $\\tilde r_1$ 与其他所有 $x_j$ 正交，且 $\\sum \\tilde r_{i1}\\hat u_i=0$。把 $y=\\hat\\beta_0+\\hat\\beta_1x_1+\\dots+\\hat u$ 两边乘 $\\tilde r_{i1}$ 求和，其他项为 0，只剩 $\\sum\\tilde r_{i1}y_i=\\hat\\beta_1\\sum\\tilde r_{i1}^2$。", "id": "a49b8707"}, {"ch": 3, "tier": "进阶", "topic": "Var推导", "q": "推导 $Var(\\hat\\beta_1)=\\sigma^2/[SST_1(1-R_1^2)]$ 的思路。", "a": "由两步法 $\\hat\\beta_1=\\beta_1+\\dfrac{\\sum\\tilde r_{i1}u_i}{\\sum\\tilde r_{i1}^2}$，条件于 X，方差 $=\\sigma^2\\sum\\tilde r_{i1}^2/(\\sum\\tilde r_{i1}^2)^2=\\sigma^2/SSR_1$。而 $SSR_1=SST_1(1-R_1^2)$。", "id": "d966767b"}, {"ch": 3, "tier": "进阶", "topic": "σ²无偏", "q": "为什么 $E(\\hat\\sigma^2)=\\sigma^2$？直觉？", "a": "残差满足 $k+1$ 个线性约束，只有 $n-k-1$ 个自由变动；$E(SSR)=(n-k-1)\\sigma^2$，所以除以 $n-k-1$ 才无偏。", "id": "5e3cd8da"}, {"ch": 3, "tier": "进阶", "topic": "GM证明思路", "q": "高斯-马尔可夫定理的证明思路？", "a": "设另一线性无偏估计量 $\\tilde\\beta=\\sum c_iy_i$，无偏要求 $\\sum c_i=0$, $\\sum c_ix_i=1$。令 $c_i=w_i+d_i$（$w_i$ 是 OLS 权重），无偏性迫使 $\\sum w_id_i=0$，于是 $Var(\\tilde\\beta)=\\sigma^2\\sum w_i^2+\\sigma^2\\sum d_i^2\\ge Var(\\hat\\beta)$。", "id": "6ac726ff"}, {"ch": 3, "tier": "进阶", "topic": "共线性判断", "q": "加入变量后 R² 变化、se 变化，能说明是多重共线性吗？", "a": "不能单凭此判断。共线性的证据是：自变量间高相关/高 $R_j^2$/高 VIF，并且 se 变大但整体 F 显著、联合显著而单个不显著等。se 变大也可能由 $\\sigma^2$、样本变化引起。", "id": "b9e61f5b"}, {"ch": 3, "tier": "进阶", "topic": "OVB一般形式", "q": "多个遗漏变量/多个自变量时，偏误还能简单判断符号吗？", "a": "一般不能。只有当其他自变量与遗漏变量**无关**（或近似）时，才能近似用二元情形的符号判断。", "id": "2ef17ad1"}, {"ch": 3, "tier": "进阶", "topic": "R²与统计量", "q": "为什么不能用 R² 的大小决定该不该加变量？", "a": "因为 R² 只增不减；加入无关变量也会增大。选变量应基于理论、显著性、调整 R² 等，而不是 R² 最大。", "id": "b4e1f97"}, {"ch": 3, "tier": "进阶", "topic": "β=0时", "q": "当 $\\beta_2=0$ 时，$\\hat\\beta_1$ 与 $\\tilde\\beta_1$ 都无偏，哪个方差更小？", "a": "若 $x_1,x_2$ 样本相关，简单回归 $\\tilde\\beta_1$ 方差更小（$Var=\\sigma^2/SST_1$，没有 $1-R_1^2$ 惩罚）。若不相关，两者方差相同。", "id": "f23f2f20"}, {"ch": 3, "tier": "少见", "topic": "偏误大小", "q": "偏误 $\\beta_2\\delta_1$ 中 $\\delta_1$ 如何得到？", "a": "把遗漏变量 $x_2$ 对 $x_1$ 做简单回归的斜率（样本 $\\tilde\\delta_1$）。", "id": "d4738b7f"}, {"ch": 3, "tier": "少见", "topic": "多个共线", "q": "一组变量高度共线，但我只关心另一个变量 $x_1$ 的系数，需要担心吗？", "a": "不必。只要 $x_1$ 与这组变量之间不共线，$Var(\\hat\\beta_1)$ 不受其影响；共线只影响共线变量彼此的系数方差。", "id": "bcae8f7d"}, {"ch": 3, "tier": "少见", "topic": "控制变量的\"坏控制\"", "q": "为什么不能无限制加控制变量？", "a": "1) 增大方差/损失自由度；2) 如果加的是 x 影响 y 的**中间机制/结果变量**，会把要估计的效应的一部分\"控制掉\"，造成偏差。", "id": "93bab661"}, {"ch": 3, "tier": "少见", "topic": "多元回归的R²分解", "q": "多元回归的 $R^2$ 能分成各变量单独贡献吗？", "a": "一般不能。变量相关时贡献不可加；只有自变量互相不相关时才能近似按比例分解。", "id": "f5984004"}, {"ch": 3, "tier": "少见", "topic": "两步法含义", "q": "为什么说 $\\hat\\beta_1$ 度量的是\"其他变量保持不变\"？", "a": "因为 $\\tilde r_1$ 已经把 $x_1$ 中能被其他 x 线性解释的部分扣掉，剩下的变异与其他 x 无关，用它去解释 y，自然是\"净效应\"。", "id": "3f0a38ea"}, {"ch": 4, "tier": "基础", "topic": "MLR.6", "q": "MLR.6 是什么？它带来什么结论？", "a": "正态性：$u|x_1,\\dots,x_k\\sim N(0,\\sigma^2)$。结合 MLR.1–5（合称**经典线性模型假定，CLM**）：\n- $\\hat\\beta_j|X\\sim N(\\beta_j,Var(\\hat\\beta_j))$，标准化后 $\\dfrac{\\hat\\beta_j-\\beta_j}{se(\\hat\\beta_j)}\\sim t_{n-k-1}$。\n- 小样本下做 t、F 精确检验需要它。", "id": "46fa2ac1"}, {"ch": 4, "tier": "基础", "topic": "t分布", "q": "$\\dfrac{\\hat\\beta_j-\\beta_j}{se(\\hat\\beta_j)}$ 服从什么分布？自由度是多少？为什么不是正态？", "a": "服从 $t_{n-k-1}$。用估计的 $\\hat\\sigma$ 代替未知 $\\sigma$，多了一层不确定性，所以由正态变成 t；n 大时 t 接近标准正态。", "id": "c7cc73eb"}, {"ch": 4, "tier": "基础", "topic": "t检验步骤", "q": "检验 $H_0:\\beta_j=0$（双侧）的步骤？", "a": "1. $H_0:\\beta_j=0$，$H_1:\\beta_j\\ne0$\n2. 算 $t=\\hat\\beta_j/se(\\hat\\beta_j)$\n3. 与临界值 $t_{\\alpha/2,\\,n-k-1}$ 比：$|t|>c$ 则拒绝 $H_0$（或 $p<\\alpha$）\n4. 结论：\"在 α 水平下 $x_j$ 统计显著\"", "id": "84aaf296"}, {"ch": 4, "tier": "基础", "topic": "单双侧", "q": "单侧检验与双侧检验的区别？何时用单侧？", "a": "双侧 $H_1:\\beta_j\\ne0$，临界值取 $\\alpha/2$ 分位；右侧 $H_1:\\beta_j>0$，拒绝域 $t>t_\\alpha$；左侧 $H_1:\\beta_j<0$，拒绝域 $t<-t_\\alpha$。\n- 只有理论事先明确方向时才用单侧；单侧更容易拒绝。", "id": "e96e107b"}, {"ch": 4, "tier": "基础", "topic": "p值", "q": "p 值是什么？怎么用它判断？", "a": "在 $H_0$ 成立时，得到**至少和当前统计量一样极端**的结果的概率（双侧 $=2P(T>|t|)$）。\n- 最小的、仍能拒绝 $H_0$ 的显著性水平。\n- $p<\\alpha$ 则拒绝 $H_0$。p 越小，对 $H_0$ 越不利。\n- **不是**\"$H_0$ 为真的概率\"。", "id": "20dd8373"}, {"ch": 4, "tier": "基础", "topic": "显著的含义", "q": "怎么看显著不显著——拿什么和什么比？", "a": "拿 $|t|$ 和临界值比（或拿 p 和 α 比）。拒绝原假设 $H_0:\\beta_j=0$ 就叫\"在该水平上统计显著\"。\n- 星号只是 p 的快捷记号，常见：$*\\ p<0.1$，$**\\ p<0.05$，$***\\ p<0.01$（星越多，拒绝 $H_0$ 的把握越大）。", "id": "19e499b1"}, {"ch": 4, "tier": "基础", "topic": "不拒绝", "q": "不能拒绝 $H_0$ 能说\"接受 $H_0$\"（β=0）吗？", "a": "不能。只能说\"没有足够证据拒绝\"，可能是真的为 0，也可能是样本小、se 大、检验功效不够。", "id": "b130d483"}, {"ch": 4, "tier": "基础", "topic": "经验临界值", "q": "常用的双侧 5% 临界值大约是多少？", "a": "n 较大时约为 **1.96**（经验上取 2）；自由度小时更大（如 df=20 时 2.086）。1% 约 2.58，10% 约 1.645。", "id": "7b696295"}, {"ch": 4, "tier": "基础", "topic": "置信区间", "q": "$\\beta_j$ 的 95% 置信区间公式及含义？", "a": "$$\\hat\\beta_j\\pm t_{0.025,\\,n-k-1}\\cdot se(\\hat\\beta_j)$$\n含义：重复抽样构造这样的区间，约 95% 的区间会包含真值（**不是**\"真值有 95% 概率落在这个固定区间里\"）。", "id": "57e658ec"}, {"ch": 4, "tier": "基础", "topic": "区间与检验", "q": "置信区间与双侧检验是什么关系？", "a": "95% CI 不含 $c$ ⇔ 在 5% 水平双侧拒绝 $H_0:\\beta_j=c$。区间含 0 ⇔ 5% 水平不显著。", "id": "408e5858"}, {"ch": 4, "tier": "基础", "topic": "F检验用途", "q": "F 检验用来检验什么？", "a": "**联合约束**：如 $H_0:\\beta_1=\\beta_2=0$，或整体显著性 $H_0:\\beta_1=\\dots=\\beta_k=0$，以及线性约束（如 $\\beta_1=\\beta_2$）。", "id": "d6a09403"}, {"ch": 4, "tier": "基础", "topic": "F统计量", "q": "写出 F 统计量（SSR 形式与 R² 形式）。", "a": "$$F=\\frac{(SSR_r-SSR_{ur})/q}{SSR_{ur}/(n-k-1)}=\\frac{(R^2_{ur}-R^2_r)/q}{(1-R^2_{ur})/(n-k-1)}\\sim F_{q,\\,n-k-1}$$\n$q$ = 约束个数，$r$ = 受约束模型，$ur$ = 无约束模型。F 大则拒绝 $H_0$。\n- R² 形式只有在两个模型**因变量相同**时才能用。", "id": "4bb1776"}, {"ch": 4, "tier": "基础", "topic": "整体显著性F", "q": "整体显著性检验（回归 F 统计量）怎么写？", "a": "$H_0:\\beta_1=\\dots=\\beta_k=0$，$q=k$，受约束模型只有截距（$R_r^2=0$）：\n$$F=\\frac{R^2/k}{(1-R^2)/(n-k-1)}$$", "id": "b96d5160"}, {"ch": 4, "tier": "基础", "topic": "t与F", "q": "t 检验和 F 检验的关系？", "a": "检验单个系数（$q=1$）时 $F=t^2$，结论一致。", "id": "44638e87"}, {"ch": 4, "tier": "基础", "topic": "联合vs单个", "q": "为什么有时每个变量单个 t 不显著，但联合 F 显著？", "a": "变量之间高度相关（多重共线性）时，单个系数 se 很大所以 t 小，但联合起来对 y 有显著解释力，F 显著。", "id": "eb403627"}, {"ch": 4, "tier": "基础", "topic": "为什么不逐个t", "q": "联合假设为什么不能用几个 t 检验代替？", "a": "多个单独检验的整体显著性水平不是 α（会累积），且忽略了估计量之间的相关性。F 检验同时处理这些。", "id": "6bf9f33"}, {"ch": 4, "tier": "基础", "topic": "经济显著性", "q": "统计显著与经济显著（实际重要）有什么区别？", "a": "统计显著看 $|t|$（系数相对 se 的大小）；经济显著看系数本身**数值大小**是否有实际意义。大样本下很小的系数也可能统计显著但经济意义微弱；小样本中系数大但不显著也值得关注。", "id": "f73bcd9f"}, {"ch": 4, "tier": "基础", "topic": "单位与t", "q": "改变变量单位，t 值会变吗？", "a": "不会。$\\hat\\beta$ 与 se 同比例变化，比值 t 不变。所以改单位改变不了显著性。", "id": "4d28b175"}, {"ch": 4, "tier": "进阶", "topic": "线性组合检验", "q": "如何检验 $H_0:\\beta_1=\\beta_2$（线性组合）？", "a": "两种做法：\n1. 令 $\\theta=\\beta_1-\\beta_2$，算 $t=\\dfrac{\\hat\\beta_1-\\hat\\beta_2}{se(\\hat\\beta_1-\\hat\\beta_2)}$，其中 $se=\\sqrt{se_1^2+se_2^2-2\\,Cov(\\hat\\beta_1,\\hat\\beta_2)}$（需要协方差）。\n2. **重新参数化**：令 $\\theta=\\beta_1-\\beta_2$，代入 $\\beta_1=\\theta+\\beta_2$，把模型改写成含 $\\theta$ 的回归，直接对 $\\theta$ 做 t 检验。", "id": "83c431c2"}, {"ch": 4, "tier": "进阶", "topic": "重新参数化", "q": "重新参数化的好处是什么？举例。", "a": "把对线性组合的检验变成对**某个新系数**的普通 t 检验，不用算协方差。例：$y=\\beta_0+\\beta_1x_1+\\beta_2x_2+u$，令 $\\theta=\\beta_1-\\beta_2$，则 $y=\\beta_0+\\theta x_1+\\beta_2(x_1+x_2)+u$，检验 $\\theta=0$。", "id": "1c6fcc65"}, {"ch": 4, "tier": "进阶", "topic": "线性约束F", "q": "检验 $\\beta_1=\\beta_2$ 的 F 检验，受约束模型怎么写？", "a": "把 $\\beta_1=\\beta_2$ 代入：$y=\\beta_0+\\beta_1(x_1+x_2)+\\dots+u$，把 $x_1+x_2$ 当成一个变量回归得 $SSR_r$，$q=1$。", "id": "ae54f397"}, {"ch": 4, "tier": "进阶", "topic": "t检验功效", "q": "什么因素让 t 检验更容易拒绝 $H_0$？", "a": "样本量大、x 变异大、$\\sigma^2$ 小、共线性弱（se 小）；效应本身大；显著性水平放宽（α 大）。", "id": "1dca40bc"}, {"ch": 4, "tier": "进阶", "topic": "非零原假设", "q": "检验 $H_0:\\beta_j=c$（$c\\ne0$）怎么算 t？", "a": "$$t=\\frac{\\hat\\beta_j-c}{se(\\hat\\beta_j)}$$", "id": "7a1553b9"}, {"ch": 4, "tier": "进阶", "topic": "第一类错误", "q": "第一类、第二类错误是什么？显著性水平 α 是什么？", "a": "第一类：$H_0$ 为真却拒绝（概率 = α）；第二类：$H_0$ 为假却没拒绝。α 是我们事先设定可接受的第一类错误概率。", "id": "2df7252b"}, {"ch": 4, "tier": "进阶", "topic": "p值与单侧", "q": "双侧 p 值如何换算成单侧 p 值？", "a": "若估计符号与 $H_1$ 方向一致，单侧 $p$ = 双侧 $p$/2；方向相反则单侧 p = 1 − 双侧 p/2（不可能拒绝）。", "id": "1c6569f0"}, {"ch": 4, "tier": "进阶", "topic": "置信区间影响因素", "q": "什么情况下置信区间更窄？", "a": "se 小（σ̂ 小、n 大、x 变异大）、置信水平低（如 90% 比 95% 窄）、自由度大（t 临界值小）。", "id": "1c05fdfc"}, {"ch": 4, "tier": "进阶", "topic": "F与R²注意", "q": "R² 形式的 F 统计量什么时候不能用？", "a": "受约束模型与无约束模型**因变量不同**时（如受约束时把 y 移项改成 $y-x_1$），$SST$ 不同，R² 不可比，必须用 SSR 形式。", "id": "4f6a246f"}, {"ch": 4, "tier": "进阶", "topic": "对数与t", "q": "检验 $\\log y$ 方程中某变量的系数时，临界值怎么选？", "a": "同样用 $t_{n-k-1}$；\"显著\"是对系数是否为 0 的检验，与是否取对数无关。", "id": "eff540da"}, {"ch": 4, "tier": "少见", "topic": "协方差", "q": "为什么检验 $\\beta_1-\\beta_2$ 时 $se$ 不是 $se_1+se_2$ 或 $\\sqrt{se_1^2+se_2^2}$？", "a": "$Var(\\hat\\beta_1-\\hat\\beta_2)=Var_1+Var_2-2Cov(\\hat\\beta_1,\\hat\\beta_2)$，需要估计量的协方差，一般不为 0。", "id": "a9988673"}, {"ch": 4, "tier": "少见", "topic": "F分布性质", "q": "F 统计量有什么性质？拒绝域在哪一侧？", "a": "$F\\ge0$，右偏分布；只有 F **很大**时才拒绝 $H_0$（右侧单侧检验），因为约束使 SSR 增加越多，说明约束越不合理。", "id": "86798178"}, {"ch": 4, "tier": "少见", "topic": "约束提高SSR", "q": "为什么受约束模型的 $SSR_r\\ge SSR_{ur}$？", "a": "约束缩小了可选参数范围，最小值只会更大或相等。", "id": "adf3b866"}, {"ch": 4, "tier": "少见", "topic": "CLM正态必要性", "q": "为什么现实中常常不满足 MLR.6，还能用 t 检验？", "a": "大样本下由中心极限定理，OLS 估计量近似正态，t、F 检验近似成立（第5章）；小样本且 u 明显非正态时 t 检验不精确。", "id": "1f09ec84"}, {"ch": 4, "tier": "少见", "topic": "置信区间的解释", "q": "\"95% 置信区间 [a, b]\"为什么不能说\"β 有 95% 概率在 [a, b]\"？", "a": "β 是固定未知常数，不随机；随机的是区间。95% 指**构造方法**的覆盖率。", "id": "cd0a1dd4"}, {"ch": 4, "tier": "少见", "topic": "多重检验", "q": "对一个回归里很多个变量逐个看星号，有什么隐患？", "a": "变量多时，偶然出现显著的概率增大（多重检验问题）；因此要结合理论，不能只\"挑显著的讲\"。", "id": "93e20b61"}, {"ch": 5, "tier": "基础", "topic": "为什么学大样本", "q": "为什么需要大样本理论（渐近性质）？", "a": "小样本下 t、F 精确分布依赖 MLR.6（正态）。大样本下即使 u 不正态，用 LLN、CLT 也能得到 OLS 的一致性和渐近正态性，从而继续做近似的 t、F 检验。", "id": "89e17a38"}, {"ch": 5, "tier": "基础", "topic": "一致性定义", "q": "什么叫估计量\"一致\"？与无偏有何区别？", "a": "一致：$n\\to\\infty$ 时 $\\hat\\beta_j\\xrightarrow{p}\\beta_j$（$plim\\hat\\beta_j=\\beta_j$），即样本越大越集中在真值附近。\n- 无偏是**固定样本量**下的\"平均\"性质；一致是**样本量趋于无穷**的性质。两者互不包含。", "id": "623aa596"}, {"ch": 5, "tier": "基础", "topic": "OLS一致性条件", "q": "OLS 一致性需要什么假定？比无偏性弱在哪？", "a": "MLR.1–MLR.3 以及 **MLR.4'**：$E(u)=0$，$Cov(x_j,u)=0$（$u$ 与每个 $x_j$ 不相关）。比 $E(u|x)=0$ 弱：只要求不相关，不要求均值独立；但也意味着遗漏的非线性项、违反 MLR.4' 都会使 OLS **不一致**。", "id": "6fb18987"}, {"ch": 5, "tier": "基础", "topic": "MLR.4'", "q": "MLR.4 与 MLR.4' 的区别？", "a": "MLR.4：$E(u|x_1,\\dots,x_k)=0$（强，保证无偏）；MLR.4'：$E(u)=0$ 且 $Cov(x_j,u)=0$（弱，只保证一致）。MLR.4 ⇒ MLR.4'，反之不成立。", "id": "38632db7"}, {"ch": 5, "tier": "基础", "topic": "一致性推导", "q": "推导简单回归 $\\hat\\beta_1$ 的一致性。", "a": "$$\\hat\\beta_1=\\beta_1+\\frac{n^{-1}\\sum(x_i-\\bar x)u_i}{n^{-1}\\sum(x_i-\\bar x)^2}$$\n由大数定律，分子 $\\xrightarrow{p}Cov(x,u)$，分母 $\\xrightarrow{p}Var(x)>0$，所以 $plim\\hat\\beta_1=\\beta_1+\\dfrac{Cov(x,u)}{Var(x)}$。若 $Cov(x,u)=0$，则一致。", "id": "53e269ee"}, {"ch": 5, "tier": "基础", "topic": "不一致性", "q": "当 $Cov(x,u)\\ne0$ 时 $plim\\hat\\beta_1$ 是多少？", "a": "$$plim\\,\\hat\\beta_1=\\beta_1+\\frac{Cov(x_1,u)}{Var(x_1)}$$\n增大样本不能消除这个偏差，只会越来越接近\"错误的值\"。", "id": "60bbaf42"}, {"ch": 5, "tier": "基础", "topic": "遗漏变量不一致", "q": "遗漏变量情形下 $plim\\tilde\\beta_1$ 是什么？", "a": "$$plim\\,\\tilde\\beta_1=\\beta_1+\\beta_2\\delta_1,\\quad \\delta_1=\\frac{Cov(x_1,x_2)}{Var(x_1)}$$\n形式与小样本偏误相同，符号判断规则也相同，只是改成总体量。", "id": "5bbf479b"}, {"ch": 5, "tier": "基础", "topic": "LLN", "q": "大数定律（LLN）说什么？", "a": "独立同分布且期望存在时，样本均值依概率收敛到总体均值：$\\bar W_n\\xrightarrow{p}\\mu$。", "id": "c65b0dc0"}, {"ch": 5, "tier": "基础", "topic": "plim性质", "q": "plim 有哪些常用性质？", "a": "- $plim\\,g(\\hat\\theta)=g(plim\\,\\hat\\theta)$（g 连续）\n- $plim(a+b)=plim\\,a+plim\\,b$，$plim(ab)=plim\\,a\\cdot plim\\,b$，$plim(a/b)=plim\\,a/plim\\,b$（分母极限不为 0）\n- 这是比期望更方便的地方（期望不能直接对非线性函数穿过）。", "id": "acb436bc"}, {"ch": 5, "tier": "基础", "topic": "CLT", "q": "中心极限定理（CLT）说什么？", "a": "iid、方差有限时，$\\dfrac{\\bar W-\\mu}{\\sigma/\\sqrt n}\\xrightarrow{d}N(0,1)$：样本均值标准化后**渐近服从标准正态**，不管原分布是什么。", "id": "db8def2f"}, {"ch": 5, "tier": "基础", "topic": "渐近正态", "q": "OLS 的渐近正态性结论是什么？", "a": "在 MLR.1–MLR.5 下，$\\dfrac{\\hat\\beta_j-\\beta_j}{se(\\hat\\beta_j)}\\xrightarrow{d}N(0,1)$，所以大样本下无需正态假定也可以用 t、F 检验（近似）。", "id": "f48aa148"}, {"ch": 5, "tier": "基础", "topic": "渐近方差", "q": "OLS 估计量的方差随 n 如何变化？", "a": "$Var(\\hat\\beta_j)\\approx\\sigma^2/(n\\cdot\\sigma_j^2(1-R_j^2))$ 量级，即以 $1/n$ 的速度收缩，标准误以 $1/\\sqrt n$ 的速度收缩。", "id": "d5d533bc"}, {"ch": 5, "tier": "基础", "topic": "LM统计量", "q": "LM（拉格朗日乘数）检验是什么？步骤？", "a": "大样本下检验排除性约束 $H_0:$ 某 q 个系数为 0 的方法：\n1. 用受约束模型回归 y，得残差 $\\tilde u$\n2. 把 $\\tilde u$ 对**所有**自变量（包括被约束的）回归，得 $R_u^2$\n3. $LM=nR_u^2\\sim\\chi^2_q$（渐近），大于临界值则拒绝 $H_0$。", "id": "f11a7b77"}, {"ch": 5, "tier": "进阶", "topic": "有偏但一致", "q": "举一个\"有偏但一致\"的估计量。", "a": "例：$\\hat\\sigma^2_{MLE}=SSR/n$（除以 n 而非 $n-k-1$）：有偏，但 $n\\to\\infty$ 时一致；或 $\\bar W_n+1/n$。", "id": "22aa83b1"}, {"ch": 5, "tier": "进阶", "topic": "无偏但不一致", "q": "举一个\"无偏但不一致\"的估计量。", "a": "只用第一个观测 $W_1$ 估计总体均值：$E(W_1)=\\mu$ 无偏，但方差不随 n 减小，不一致。", "id": "a610cfc1"}, {"ch": 5, "tier": "进阶", "topic": "渐近正态与MLR.6", "q": "大样本下可以不要 MLR.6 的原因？", "a": "$\\hat\\beta_j-\\beta_j$ 可写成 $u_i$ 的加权和，CLT 使其渐近正态，与 $u$ 本身是否正态无关。", "id": "66bc8078"}, {"ch": 5, "tier": "进阶", "topic": "同方差与渐近", "q": "大样本下，同方差假定（MLR.5）还需要吗？", "a": "需要。渐近方差公式和常规 se 依赖同方差；异方差下要用稳健标准误（第8章）。", "id": "b5c37183"}, {"ch": 5, "tier": "进阶", "topic": "渐近有效", "q": "OLS 的渐近有效性是什么？", "a": "MLR.1–5 下，OLS 在一类一致估计量中有最小的渐近方差（渐近有效）。", "id": "ca90066b"}, {"ch": 5, "tier": "进阶", "topic": "样本量与偏误", "q": "一致但有偏的估计量，在小样本下该怎么办？", "a": "只能依赖大样本；小样本下会有偏，需谨慎。", "id": "a370b1f1"}, {"ch": 5, "tier": "进阶", "topic": "收敛概念", "q": "依概率收敛与依分布收敛的区别？", "a": "依概率收敛：随机变量本身越来越接近某常数；依分布收敛：随机变量的**分布**越来越接近某分布（如标准正态）。LLN 属前者，CLT 属后者。", "id": "ede7a980"}, {"ch": 5, "tier": "少见", "topic": "LM与F", "q": "LM 检验与 F 检验的联系？", "a": "大样本下渐近等价（$qF\\approx LM$），只是 LM 只需估计受约束模型 + 一个辅助回归。", "id": "a1bd3aa5"}, {"ch": 5, "tier": "少见", "topic": "Slutsky", "q": "为什么用 $\\hat\\sigma$ 代替 $\\sigma$ 不破坏渐近正态？", "a": "$\\hat\\sigma\\xrightarrow{p}\\sigma$ 一致，由 Slutsky 定理（plim 的比值性质），标准化统计量仍渐近 N(0,1)。", "id": "ed3be08d"}, {"ch": 5, "tier": "少见", "topic": "渐近中的x", "q": "一致性推导中为什么需要 $Var(x)>0$？", "a": "分母极限 $Var(x)$ 不能为 0（对应 MLR.3 样本有变异），否则比值无定义。", "id": "e3ed9061"}, {"ch": 5, "tier": "少见", "topic": "收敛速度", "q": "为什么说 OLS 是 $\\sqrt n$-一致的？", "a": "$\\sqrt n(\\hat\\beta_j-\\beta_j)$ 渐近有非退化的正态分布，所以 $\\hat\\beta_j$ 以 $1/\\sqrt n$ 的速度收敛到 $\\beta_j$。", "id": "44603856"}, {"ch": 5, "tier": "少见", "topic": "LM自由度", "q": "LM 统计量的自由度是什么？", "a": "被检验的约束个数 q，$LM\\sim\\chi^2_q$。", "id": "6a5476ce"}, {"ch": 6, "tier": "基础", "topic": "单位变化", "q": "y 乘 c、某个 $x_j$ 乘 c，对系数、se、t、R² 各有什么影响？", "a": "- y×c：所有系数、所有 se 都×c，残差×c\n- $x_j$×c：该系数与其 se 都÷c，其他系数不变，残差不变\n- **t、p、F、R² 都不变**，显著性不变", "id": "f98ee61d"}, {"ch": 6, "tier": "基础", "topic": "系数比较", "q": "为什么不能直接比较系数大小来判断谁更重要？", "a": "系数大小依赖变量单位（睡眠\"小时\"改\"分钟\"，系数就缩小 60 倍）。要比较重要性要用标准化系数。", "id": "982e1b28"}, {"ch": 6, "tier": "基础", "topic": "标准化系数", "q": "标准化系数（beta 系数）怎么算？含义？", "a": "$$\\hat b_j=\\frac{\\hat\\sigma_j}{\\hat\\sigma_y}\\hat\\beta_j$$\n（或把所有变量先做 z 分数再回归，截距消失。）含义：$x_j$ 变动 **1 个标准差**，y 变动 $\\hat b_j$ 个标准差；无量纲，可比大小。", "id": "aab0423"}, {"ch": 6, "tier": "基础", "topic": "对数读法", "q": "对数模型四种读法？", "a": "- 水平-水平：Δy = β1Δx\n- 对数-水平：x +1，y 约变 $100\\beta_1\\%$\n- 水平-对数：x +1%，y 约变 $\\beta_1/100$ 单位\n- 对数-对数：x +1%，y 约变 $\\beta_1\\%$（弹性）", "id": "d00deb82"}, {"ch": 6, "tier": "基础", "topic": "精确百分比", "q": "$\\log y$ 方程中 x 变 Δx，y 变化的精确百分比？", "a": "$$\\%\\Delta y=100\\,(e^{\\beta_1\\Delta x}-1)$$\n$100\\beta_1\\Delta x$ 只是近似，$\\beta_1$ 越大近似越差（如 $\\beta_1=0.5$：近似 50%，精确 64.9%）。", "id": "9d24cdf8"}, {"ch": 6, "tier": "基础", "topic": "为什么取对数", "q": "使用对数形式有什么好处？", "a": "1. 系数可解释为百分比/弹性\n2. 缩小变量取值范围，缓解异常值\n3. 使条件分布更接近正态、缓解异方差\n4. 对数变量改单位只改截距", "id": "75c8dd9a"}, {"ch": 6, "tier": "基础", "topic": "什么变量取对数", "q": "哪些变量通常取对数，哪些不取？", "a": "- 取：严格为正的货币量（工资、销售额）、数值很大的变量（人口、资产）\n- 不取：以年为单位的变量（年龄、教育年限、经验）、**虚拟变量**、序数变量；含 0 或负数的变量**不能**取对数\n- 比例变量可取可不取，注意\"百分点\" vs \"百分比\"。", "id": "4a6690ca"}, {"ch": 6, "tier": "基础", "topic": "二次项边际效应", "q": "$y=\\beta_0+\\beta_1x+\\beta_2x^2+u$ 的边际效应与转折点？", "a": "$$\\frac{\\partial y}{\\partial x}=\\beta_1+2\\beta_2x,\\qquad x^*=\\left|\\frac{\\beta_1}{2\\beta_2}\\right|$$\n边际效应随 x 变化，不能只看 $\\beta_1$；转折点处边际效应为 0。", "id": "1cda1942"}, {"ch": 6, "tier": "基础", "topic": "β1的含义(二次项)", "q": "二次项模型中单独的 $\\beta_1$ 能怎么解释？", "a": "只表示 **x=0 时**的边际效应（x 从 0 起步多一单位的效应）。若 x=0 无现实意义，要把有意义的 x（如均值）代入 $\\beta_1+2\\beta_2x$ 来解释。", "id": "588469dd"}, {"ch": 6, "tier": "基础", "topic": "交互项", "q": "交互项模型 $y=\\beta_0+\\beta_1x_1+\\beta_2x_2+\\beta_3x_1x_2+u$ 中，$x_1$ 的偏效应？$\\beta_2$、$\\beta_3$ 的含义？", "a": "$$\\frac{\\partial y}{\\partial x_1}=\\beta_1+\\beta_3x_2$$\n- $\\beta_3$：$x_2$ 每增加 1，$x_1$ 的**斜率**变化多少（对斜率的影响，不是对截距）\n- $\\beta_1$：$x_2=0$ 时 $x_1$ 的效应（$x_2=0$ 要有意义才好解释）", "id": "cbf11643"}, {"ch": 6, "tier": "基础", "topic": "APE", "q": "平均偏效应（APE）是什么？", "a": "非线性模型中偏效应随 x 取值而变。**先对每个观测算偏效应，代入估计参数，再对样本取平均**作为总结。如二次项：$\\widehat{APE}=\\hat\\beta_1+2\\hat\\beta_2\\bar x$。", "id": "a80c11aa"}, {"ch": 6, "tier": "基础", "topic": "R²不减", "q": "加入变量后 $R^2$ 与调整 $R^2$ 有什么不同？", "a": "$R^2$ 加变量一定不降；调整 $R^2$ 对新增变量有惩罚，可升可降，甚至为负。", "id": "9b6b42d6"}, {"ch": 6, "tier": "基础", "topic": "调整R²公式", "q": "调整 $R^2$ 的公式？", "a": "$$\\bar R^2=1-\\frac{SSR/(n-k-1)}{SST/(n-1)}=1-(1-R^2)\\frac{n-1}{n-k-1}$$\n分子分母各除以自己的自由度。", "id": "70a0b8cd"}, {"ch": 6, "tier": "基础", "topic": "调整R²与t", "q": "加一个变量，调整 $R^2$ 什么时候上升？", "a": "当且仅当该变量系数的 $|t|>1$。注意：这**不等于**该变量统计显著（显著需要 |t|≈2）。", "id": "16e4a278"}, {"ch": 6, "tier": "基础", "topic": "R²不可跨比", "q": "$\\log(y)$ 模型与 $y$ 模型的 $R^2$ 能比较吗？", "a": "不能。因变量不同，SST 不同，解释的是不同的变异。取对数的理由应是分布、解释等，**不能是 R² 变大**。", "id": "68068735"}, {"ch": 6, "tier": "基础", "topic": "预测误差分解", "q": "预测误差 $e_0=y_0-\\hat y_0$ 由什么组成？", "a": "$$e_0=u_0-\\big[(\\hat\\beta_0-\\beta_0)+(\\hat\\beta_1-\\beta_1)x_0\\big]$$\n两个来源：**新观测自身的随机扰动 $u_0$**（避免不了）+ **估计误差**。", "id": "baeff636"}, {"ch": 6, "tier": "基础", "topic": "预测无偏", "q": "预测误差无偏性要用到哪些假定？", "a": "MLR.1–4：$E(u_0)=0$，$E(\\hat\\beta_j)=\\beta_j$，所以 $E(e_0)=0$。", "id": "1562641d"}, {"ch": 6, "tier": "基础", "topic": "BLUP", "q": "为什么 MLR.1–5 下 $\\hat y_0$ 是 $y_0$ 的最优线性无偏预测量（BLUP）？（老师说小测会考）", "a": "1. **线性**：$\\hat y_0$ 是 $y_i$ 的线性组合\n2. **无偏**：$E(e_0)=0$（MLR.1–4）\n3. **最优**：任一线性无偏预测量 $\\tilde y_0$ 的预测误差方差 $=\\sigma^2+Var(\\tilde y_0)$（$u_0$ 与样本无关，MLR.2、5），而由**高斯–马尔可夫**，OLS 的 $Var(\\hat y_0)\\le Var(\\tilde y_0)$，故 $Var(y_0-\\hat y_0)$ 最小。", "id": "bff6fdf1"}, {"ch": 6, "tier": "基础", "topic": "预测方差", "q": "简单回归预测误差的方差？在什么情况下更小？", "a": "$$Var(e_0)=\\sigma^2\\left[1+\\frac1n+\\frac{(x_0-\\bar x)^2}{\\sum(x_i-\\bar x)^2}\\right]$$\n更小：$\\sigma^2$ 小、n 大、x 变异大、$x_0$ 靠近 $\\bar x$。预测区间\"中间窄、两头宽\"。", "id": "322ca3f"}, {"ch": 6, "tier": "基础", "topic": "预测区间", "q": "个别值的预测区间公式？与均值的区间有何不同？", "a": "个别值：$\\hat y_0\\pm t_{\\alpha/2}\\,se(e_0)$，$se(e_0)=\\hat\\sigma\\sqrt{1+\\frac1n+\\frac{(x_0-\\bar x)^2}{S_{xx}}}$；\n均值 $E(y_0|x_0)$ 的区间：根号内**去掉那个 1**。所以个别值的区间**更宽**（多了 $u_0$ 的方差 $\\sigma^2$）。", "id": "ae8bbaa3"}, {"ch": 6, "tier": "基础", "topic": "均值vs个别值", "q": "平均值预测和个别值预测的区别？", "a": "均值预测：$E(y|x_0)$，误差只来自抽样波动；个别值预测：$y_0=E(y|x_0)+u_0$，还要加上随机扰动，不确定性更大。", "id": "2b822d34"}, {"ch": 6, "tier": "基础", "topic": "对数预测", "q": "对数模型 $\\ln y$ 直接取指数预测 $y$ 有什么问题？如何修正？", "a": "$E(e^u)\\ne1$；$u\\sim N(0,\\sigma^2)$ 时 $E(e^u)=e^{\\sigma^2/2}>1$，所以朴素预测 $\\hat y_n=e^{\\widehat{\\ln y}}$ **系统低估**。\n修正：$\\hat y_c=e^{\\hat\\sigma^2/2}\\,e^{\\widehat{\\ln y}}$。", "id": "48d9b5e1"}, {"ch": 6, "tier": "基础", "topic": "修正预测性质", "q": "$\\hat y_c=e^{\\hat\\sigma^2/2}\\hat y_n$ 的性质？需要什么假定？", "a": "**一致但不无偏**；调整因子 $>1$，故 $\\hat y_c>\\hat y_n$；推导用到 **MLR.6**（正态）。", "id": "b2a57604"}, {"ch": 6, "tier": "基础", "topic": "对数模型R²", "q": "对数模型想与线性模型比较拟合优度，应怎么算 $R^2$？", "a": "$$R^2=[corr(y,\\hat y)]^2$$\n用预测值 $\\hat y$（还原到 y 尺度）与实际 y 的相关系数平方。", "id": "ad88940b"}, {"ch": 6, "tier": "进阶", "topic": "log(1+y)", "q": "为什么不推荐对 $\\log(1+y)$ 回归？", "a": "加的常数（1 或 0.001）与 y 的单位有关，改单位结果就变，可以被\"调出\"显著性。建议：直接取对数（丢 0 值）、用原始值（处理异常值）、或用反双曲正弦等。", "id": "885e574d"}, {"ch": 6, "tier": "进阶", "topic": "转折点意义", "q": "二次项转折点落在样本外或附近观测很少，怎么处理？", "a": "看转折点两侧观测占比。左侧只有约 1% 观测（如房间数 4.4）可忽略，甚至可换成线性模型；若 28% 观测在转折点右侧，则模型设定可能有问题（遗漏变量）。", "id": "78973990"}, {"ch": 6, "tier": "进阶", "topic": "二次项解释话术", "q": "二次项估计出倒 U 型后，怎么解释\"超过某年限后下降\"？", "a": "解释要紧扣该变量本身（如经验太长思维定式、伤害机会）；不能说\"因为年龄大了\"——那等于承认 experience 里混进了年龄的影响，暴露估计有偏。", "id": "61548664"}, {"ch": 6, "tier": "进阶", "topic": "汇报偏效应", "q": "含二次项的模型，怎么汇报偏效应？", "a": "①给出偏效应的公式；②给样本均值处的偏效应；③给几个不同 x 水平下的偏效应。", "id": "7f84c41f"}, {"ch": 6, "tier": "进阶", "topic": "x与x²共线", "q": "$x$ 和 $x^2$ 同时放入模型违反 MLR.3 吗？", "a": "不违反。MLR.3 只排除**完全**线性关系，$x^2$ 是 x 的非线性函数，只是相关度高，后果是方差变大。", "id": "bcf92732"}, {"ch": 6, "tier": "进阶", "topic": "主效应", "q": "建交互项模型时，为什么一般要把主效应也放进去？", "a": "交互项只表示调节作用；如果不含主效应，就假定了主效应为 0，容易引起设定偏误；也难以解释。", "id": "68abd85f"}, {"ch": 6, "tier": "进阶", "topic": "调整R²负", "q": "调整 $R^2$ 为什么可能为负？例子？", "a": "$R^2$ 很小而 $n-k-1$ 很小时，$(1-R^2)\\frac{n-1}{n-k-1}>1$。例：$R^2=0.10,n=51,k=10$ → $\\bar R^2=1-0.9\\times\\frac{50}{40}=-0.125$。", "id": "f4836651"}, {"ch": 6, "tier": "进阶", "topic": "预测方差分解", "q": "预测误差方差中每一项来自哪里？", "a": "$\\sigma^2$：新观测的 $u_0$；$\\sigma^2/n$ 与 $(x_0-\\bar x)^2\\sigma^2/S_{xx}$：估计 $\\hat\\beta_0,\\hat\\beta_1$ 的误差。", "id": "776e4563"}, {"ch": 6, "tier": "进阶", "topic": "n趋于无穷", "q": "n→∞ 时个别值预测误差的方差趋近于什么？", "a": "趋近于 $\\sigma^2$（只剩 $u_0$ 的随机性，估计误差消失）。", "id": "61a7e6fd"}, {"ch": 6, "tier": "进阶", "topic": "何时用标准化系数", "q": "标准化系数的缺点或注意事项？", "a": "只回答\"相对重要性（以标准差为单位）\"，仍不意味因果；依赖样本标准差；虚拟变量标准化后意义不直观。", "id": "cca91558"}, {"ch": 6, "tier": "少见", "topic": "E(e^u)推导", "q": "推导 $E(e^u)=e^{\\sigma^2/2}$。", "a": "$u\\sim N(0,\\sigma^2)$ 的矩母函数 $E(e^{tu})=e^{\\sigma^2t^2/2}$，取 $t=1$ 即得。又 $y=\\exp(x\\beta)e^u$，$u$ 与 x 独立，所以 $E(y|x)=\\exp(x\\beta)e^{\\sigma^2/2}$。", "id": "82f1ff84"}, {"ch": 6, "tier": "少见", "topic": "调整R²证明", "q": "证明\"调整 $R^2$ 上升 ⇔ $|t|>1$\"。", "a": "加入一个变量，$\\bar R^2$ 上升 ⇔ $SSR_1/(n-k-2)<SSR_0/(n-k-1)$。设 $\\Delta SSR=SSR_0-SSR_1$，化简得 $\\dfrac{\\Delta SSR}{SSR_1/(n-k-2)}>1$，左侧正是 1 个约束的 $F=t^2$，所以 $t^2>1$。", "id": "a8a760b1"}, {"ch": 6, "tier": "少见", "topic": "预测方差推导", "q": "推导简单回归预测误差方差中 $1/n$ 与 $(x_0-\\bar x)^2/S_{xx}$ 的来源。", "a": "$\\hat y_0=\\bar y+\\hat\\beta_1(x_0-\\bar x)$；其估计误差 $=\\bar u+(x_0-\\bar x)\\dfrac{\\sum(x_i-\\bar x)u_i}{S_{xx}}$，两项不相关（$\\sum(x_i-\\bar x)=0$），方差分别为 $\\sigma^2/n$ 与 $(x_0-\\bar x)^2\\sigma^2/S_{xx}$，再加上 $Var(u_0)=\\sigma^2$。", "id": "8af56bff"}, {"ch": 6, "tier": "少见", "topic": "残差分析", "q": "残差分析有什么用？大的负残差可能意味着什么？", "a": "残差里有信息：可能提示遗漏的模式或离群值。如二手车价格回归中大的负残差：可能是\"捡漏\"，也可能模型漏了该车的不可观测特征；离群值里可能藏着新认识。", "id": "192b4710"}, {"ch": 6, "tier": "少见", "topic": "标准化推导", "q": "推导 $\\hat b_j=\\hat\\beta_j\\hat\\sigma_j/\\hat\\sigma_y$。", "a": "方程两边减均值（截距消失）再除以 $\\sigma_y$：$\\dfrac{y-\\bar y}{\\sigma_y}=\\sum\\beta_j\\dfrac{\\sigma_j}{\\sigma_y}\\cdot\\dfrac{x_j-\\bar x_j}{\\sigma_j}+\\dots$，所以 z 分数前的系数就是 $\\beta_j\\sigma_j/\\sigma_y$。", "id": "2ce3a8cc"}, {"ch": 6, "tier": "少见", "topic": "log单位", "q": "对数变量改单位后，斜率变不变？", "a": "只对取对数的那个变量成立：$\\log(cx)=\\log c+\\log x$，只改截距，斜率不变；没取对数的变量改单位仍会改系数。", "id": "3e4c38a9"}, {"ch": 6, "tier": "少见", "topic": "数值例", "q": "$\\widehat{wage}=3.73+0.298\\,exper-0.0061\\,exper^2$：exper=10 的边际效应与转折点？", "a": "边际效应 $0.298-2(0.0061)(10)=0.176$；转折点 $0.298/(2\\times0.0061)\\approx24.4$ 年。", "id": "3265c174"}, {"ch": 6, "tier": "少见", "topic": "修正预测数值", "q": "$\\hat\\sigma^2=0.4$，朴素预测 $\\hat y_n=100$，修正预测？", "a": "$e^{0.2}\\times100\\approx122.1$。", "id": "ef0e0c13"}, {"ch": 7, "tier": "基础", "topic": "虚拟变量", "q": "什么是虚拟变量？它用来刻画什么？", "a": "取值只有 0 和 1 的变量（像布尔判断：是→1，否→0），用来刻画**定性信息**（性别、行业、地区、是否接受政策等）。\n- 既可以做自变量，也可以做因变量。\n- 老师强调：估计方法和前面完全一样，难点在**系数怎么解释**。", "id": "e36c931a"}, {"ch": 7, "tier": "基础", "topic": "单个虚拟变量", "q": "$wage=\\beta_0+\\delta_0\\,female+\\beta_1\\,educ+u$ 中 $\\delta_0$ 的含义？", "a": "其他条件（educ）相同时，**女性（取1）比男性（取0，基组）平均工资高多少**（为负就是低）。\n- 图形上是两条**平行**直线，截距不同：男 $\\beta_0$，女 $\\beta_0+\\delta_0$（截距变化）。", "id": "2e8b2f76"}, {"ch": 7, "tier": "基础", "topic": "代入法", "q": "老师教的\"代入法\"是什么？怎么用？", "a": "想快速理解某个虚拟变量（或交互项、该不该加它），**把 0 和 1 分别代进方程，写出各组自己的方程**，再相减。\n- 女（female=1）：$(\\beta_0+\\delta_0)+\\beta_1educ$\n- 男（female=0）：$\\beta_0+\\beta_1educ$\n- 两式相减 = $\\delta_0$。**取 1 的那一组，截距要加上它的系数。**", "id": "9735ff43"}, {"ch": 7, "tier": "基础", "topic": "虚拟变量陷阱", "q": "什么是虚拟变量陷阱？怎么避免？", "a": "只有男、女两类时，同时放 $female$ 和 $male$（再加截距）会因 $male=1-female$ 产生**完全共线性**（违反 MLR.3），模型无法估计。\n- 避免：$g$ 个组**最多放 $g-1$ 个**虚拟变量，被省略的是**基组**；或者去掉截距（但更难检验组间差异，且 $R^2$ 公式失效）。", "id": "15e07563"}, {"ch": 7, "tier": "基础", "topic": "基组", "q": "什么是基组？虚拟变量系数是和谁比？", "a": "被省略（没放进回归）的那一组。其余每个虚拟变量的系数 = **该组 − 基组**。老师的直觉：**谁没加入，剩下的系数就是跟谁比。**", "id": "3daadc49"}, {"ch": 7, "tier": "基础", "topic": "为什么不能都放", "q": "用第3章的两步法解释：为什么 $female$ 和 $male$ 不能同时放入回归？", "a": "$\\hat\\beta_j=\\dfrac{\\sum\\hat r_{ij}y_i}{\\sum\\hat r_{ij}^2}$，分母 $=SST_j(1-R_j^2)$。若 $male=1-female$，则 $female$ 被其他变量（截距）完美预测，$R_j^2=1$，残差全为 0，**分母为 0**，$\\hat\\beta_j$ 估不出来。", "id": "48291085"}, {"ch": 7, "tier": "基础", "topic": "工资例", "q": "控制学历、经验、任期后 $female$ 系数为 −1.81，只回归 $female$ 时为 −2.51。各说明什么？", "a": "- −1.81：其他条件相同时，女性时薪比男性少 1.81 美元。\n- −2.51：不控制任何因素时，男女平均工资差 2.51 美元。\n- 不控制时差距更大，因为部分差距来自男女在学历、经验、任期上的差异。", "id": "17bd68e0"}, {"ch": 7, "tier": "基础", "topic": "歧视", "q": "控制了其他因素后女性系数仍为负，能直接说\"存在歧视\"吗？", "a": "不能直接下这个结论。最中性、无争议的说法：**\"控制这些因素后，数据显示女性时薪比男性低 1.81 美元\"**。\n- 说\"歧视\"是激进结论：可能还有未控制的生产力因素；也可能是**统计性歧视**（雇主因筛选成本，按群体标签做判断）。", "id": "26d7814a"}, {"ch": 7, "tier": "基础", "topic": "log(y)百分比", "q": "$\\log(wage)=\\beta_0+\\delta_0\\,female+\\cdots$，$\\hat\\delta_0=-0.2432$。女性比男性低多少？", "a": "- **近似**：$100\\hat\\delta_0\\approx-24.32\\%$\n- **精确**：$100(e^{\\hat\\delta_0}-1)=100(e^{-0.2432}-1)\\approx-21.59\\%$\n- 因为 $w_F/w_M=e^{\\delta_0}$，$\\%\\Delta=e^{\\delta_0}-1$；系数离 0 越远，近似越差。", "id": "e5e71b88"}, {"ch": 7, "tier": "基础", "topic": "处理组对照组", "q": "项目评价中的处理组和对照组是什么？", "a": "**处理组（treatment group）**：接受政策/措施的一组（如拿到培训津贴的企业）；**对照组（control group）**：没接受的一组。用虚拟变量（是否接受处理）作自变量，系数就是两组差异。", "id": "89e59d28"}, {"ch": 7, "tier": "基础", "topic": "多类别虚拟变量", "q": "性别×婚姻共 4 组，以单身男性为基组，放 3 个虚拟变量。写出四组各自的期望工资。", "a": "- 单身男（基组）：$\\beta_0$\n- 已婚男：$\\beta_0+\\beta_1$\n- 已婚女：$\\beta_0+\\beta_2$\n- 单身女：$\\beta_0+\\beta_3$\n- 每个系数 = 该组与基组的差。", "id": "a95f0344"}, {"ch": 7, "tier": "基础", "topic": "定序变量", "q": "为什么定序变量（如信用等级 0–4）最好拆成虚拟变量，而不是直接放进去？", "a": "直接放进去等于假设**每升一级的影响相同**（AA 与 A 的差 = AAA 与 AA 的差），这个假设太强，会扭曲现实。\n- 拆成每个等级一个虚拟变量（最差等级为基组），每个等级的影响由数据自己说。", "id": "7a52956e"}, {"ch": 7, "tier": "基础", "topic": "交互项", "q": "$wage=\\beta_0+\\delta_0female+\\beta_1educ+\\delta_1female\\cdot educ+u$ 中 $\\delta_0$、$\\delta_1$ 的含义？", "a": "代入法：男 $\\beta_0+\\beta_1educ$；女 $(\\beta_0+\\delta_0)+(\\beta_1+\\delta_1)educ$。\n- $\\delta_0$：**截距差**（educ=0 时的男女差）\n- $\\delta_1$：**斜率差**，即女性与男性**教育回报率之差**\n- 老师：\"想不明白就 write it down，把各组的方程写下来。\"", "id": "acad56df"}, {"ch": 7, "tier": "基础", "topic": "交互项的误区", "q": "加了交互项后，$\\delta_0$ 能直接解释为\"男女工资差\"吗？", "a": "不能。$\\delta_0$ 只是 $educ=0$ 时的差，0 年教育没有现实意义。应在**有意义的 educ（如样本均值 12.5 年）**处估计：差异 $=\\delta_0+\\delta_1\\times12.5$。", "id": "99e1a070"}, {"ch": 7, "tier": "基础", "topic": "何时加交互项", "q": "要不要加这一整套交互项？怎么检验？", "a": "用 **F 检验**：无约束模型含所有交互项（截距、斜率都可不同），受约束模型 = 两组遵循同一个方程。$H_0$：所有交互效应（含截距差）为 0。\n- 个别交互项不显著，联合 F 仍可能显著，要看联合检验。", "id": "8f0788dd"}, {"ch": 7, "tier": "基础", "topic": "邹至庄检验", "q": "邹至庄（Chow）检验的三步？", "a": "1. 按组分别回归，得 $SSR_1$、$SSR_2$，$SSR_{ur}=SSR_1+SSR_2$（无约束）\n2. 合并全部样本回归，得 $SSR_p$（受约束）\n3. 构造 F：$$F=\\frac{[SSR_p-(SSR_1+SSR_2)]/(k+1)}{(SSR_1+SSR_2)/[n-2(k+1)]}$$\n- **前提：同方差**，异方差下无效。", "id": "f8522661"}, {"ch": 7, "tier": "基础", "topic": "Bernoulli", "q": "二值因变量 $y$ 服从什么分布？期望与方差？", "a": "伯努利分布：$P(y=1)=p(x)$，$P(y=0)=1-p(x)$。\n$$E(y|x)=p(x),\\qquad Var(y|x)=p(x)[1-p(x)]$$\n老师的直觉：建模时只能对 $y$ 取期望，\"期望意义上是 0 还是 1\" = \"等于 1 的概率是多少\"。", "id": "36148690"}, {"ch": 7, "tier": "基础", "topic": "LPM", "q": "什么是线性概率模型（LPM）？系数怎么解释？", "a": "因变量是 0/1，仍用 OLS 估计 $y=\\beta_0+\\beta_1x_1+\\cdots+\\beta_kx_k+u$。\n- $\\beta_j$：$x_j$ 增加 1 单位，**$y=1$ 的概率变化 $\\beta_j$**（百分点）。\n- 例：$kidslt6$ 系数 −0.262 → 6 岁以下孩子每多 1 个，参与劳动的概率下降 26.2 个百分点。", "id": "6b943d0d"}, {"ch": 7, "tier": "基础", "topic": "LPM缺点", "q": "LPM 有哪两个主要问题？", "a": "1. **误差项必然异方差**：$Var(u|x)=p(x)(1-p(x))$ 随 x 变，违背 MLR.5。\n2. **预测概率可能 >1 或 <0**，没法解释；边际概率效应有时不合逻辑。", "id": "d5837404"}, {"ch": 7, "tier": "基础", "topic": "LPM优点", "q": "LPM 有什么优点？", "a": "估计和解释简单、直接（系数就是对概率的边际效应）；假设少；实践中估计的效应和预测通常较好。对比 probit/logit：系数不是直接的边际效应，且要对误差分布做更强的假设。", "id": "7e72a72"}, {"ch": 7, "tier": "基础", "topic": "LPM误差", "q": "写出 LPM 误差项 $u$ 的分布，并求 $Var(u|x)$。", "a": "$y=1$ 时 $u=1-p(x)$（概率 $p$）；$y=0$ 时 $u=-p(x)$（概率 $1-p$）。\n$$Var(u|x)=p(x)[1-p(x)]=(\\beta_0+\\cdots+\\beta_kx_k)(1-\\beta_0-\\cdots-\\beta_kx_k)$$\n随 x 变化 ⇒ 异方差。", "id": "1c8fcc95"}, {"ch": 7, "tier": "基础", "topic": "LPM异方差后果", "q": "因变量是虚拟变量，OLS 违背同方差，后果是什么？", "a": "**不影响无偏性/一致性**（一致性只需 MLR.1–3 + MLR.4'），只是 OLS 不再 BLUE，常规 se、t、F 不可靠，要用**异方差稳健标准误**（期中后讲）。", "id": "99f4c10"}, {"ch": 7, "tier": "基础", "topic": "自选择", "q": "政策评价中的自选择（self-selection）是什么？为什么造成内生性？", "a": "个体根据自身特征和前景**自己选择**是否进入处理组，所以\"是否得到处理\"与影响结果的其他因素相关。\n- 例：本来就想培训的企业更可能申请培训津贴 ⇒ 回归系数**高估**津贴效果。", "id": "7ef9100f"}, {"ch": 7, "tier": "基础", "topic": "随机分配", "q": "随机分配处理组为什么只需简单回归就能得到因果效应？", "a": "随机分配使处理虚拟变量与其他影响产出的因素**不相关**（外生），所以简单线性回归的系数就是因果效应。老师类比：A/B test、给小白鼠随机分组。", "id": "1da52f08"}, {"ch": 7, "tier": "进阶", "topic": "换基组", "q": "如何检验\"已婚女性与单身女性的工资差异是否显著\"（以单身男性为基组时）？", "a": "原回归只给两者各自与基组的差（如 −0.198、−0.110），**不能直接检验两者之差**。\n- 做法：**换基组**（把已婚女性设为基组）重新估计，直接看单身女性系数的 t 值；或**重新参数化**，直接定义差。\n- 例：t=0.088/0.052≈1.69，不显著。", "id": "2098e7c0"}, {"ch": 7, "tier": "进阶", "topic": "少放虚拟变量", "q": "4 组只放 2 个虚拟变量（省略 2 组）能跑吗？系数含义变成什么？", "a": "能跑（少放不共线，多放才共线），但含义变了：被省略的**两组一起作为基组**，系数是\"与这两组的平均相比\"，**截距的数值也变了**（包含了合并的两组）。看不明白就把各组方程写出来。", "id": "b64a49bc"}, {"ch": 7, "tier": "进阶", "topic": "系数可比", "q": "同一回归中各虚拟变量的系数大小可以比较吗？", "a": "可以。它们的比较基准是**同一个基组**，且虚拟变量**没有单位问题**（不像连续变量会因改单位而改变系数）。", "id": "58e594cd"}, {"ch": 7, "tier": "进阶", "topic": "构造虚拟变量", "q": "虚拟变量可以由连续变量构造吗？怎么构造？", "a": "可以。如身高 → \"是否高于 160\"、\"是否高于 180\"、\"是否高于样本中位数\"。**切点要结合你的理论来定**（如某高度以下体育设施受限）。", "id": "b94eee7f"}, {"ch": 7, "tier": "进阶", "topic": "平均教育处差异", "q": "$\\widehat{wage}=5-2\\,female+1.0\\,educ+0.2\\,female\\cdot educ$，求 $educ=12$ 时女性比男性的工资差。", "a": "差异 $=\\delta_0+\\delta_1\\times12=-2+0.2\\times12=\\mathbf{0.4}$。\n- 注意 −2 只是 $educ=0$ 时的差，没有现实意义。", "id": "7ca38614"}, {"ch": 7, "tier": "进阶", "topic": "交互项F数值", "q": "$n=100$，$k=3$，$SSR_p=120$，$SSR_1=45$，$SSR_2=55$，求邹至庄 F 并判断（$F_{4,92}$ 的 5% 临界值约 2.47）。", "a": "$SSR_{ur}=100$，$$F=\\frac{(120-100)/4}{100/92}=4.6>2.47$$\n拒绝\"两组方程相同\"。", "id": "d01f881c"}, {"ch": 7, "tier": "进阶", "topic": "数据驱动", "q": "老师怎么评价邹至庄这类检验？加不加交互项还要考虑什么？", "a": "它是**数据驱动**的筛选方法，今天常被机器学习的变量选择替代。\n- **理论优先**：经典理论要求你考虑的就直接放进去。\n- **可解释性**：交互项太多，系数难解读；别耽误你最关心的问题。\n- 所以：理论 + F 检验 + 解释清晰度，三者权衡。", "id": "81318228"}, {"ch": 7, "tier": "进阶", "topic": "LPM越界", "q": "LPM 预测概率为负是否一定有问题？", "a": "不一定。若样本中**没有**对应取值（如没有受教育年限低于 5 年的女性），那是外推出来的区域，不用在意。问题主要出现在样本内或要解释的情景里。", "id": "6559a0a0"}, {"ch": 7, "tier": "进阶", "topic": "同方差与一致性", "q": "老师说\"一致性只需要假设 1 到 4\"，严格怎么说？", "a": "严格说是 **MLR.1–3 + MLR.4'**（$E(u)=0$，$Cov(x_j,u)=0$）。同方差只关系到 BLUE 和推断，所以 LPM 的异方差不影响一致性。", "id": "c40b5868"}, {"ch": 7, "tier": "进阶", "topic": "统计性歧视", "q": "什么是统计性歧视（statistical discrimination）？", "a": "因筛选成本高，雇主根据**群体标签**对个体做推断（老师的例子：对东亚面孔的数学能力印象；对医生、特级教师、程序员的\"形象\"要求）。特征本身可能蕴含另一些信息，所以系数为负不一定是偏好性歧视。", "id": "bc80fd53"}, {"ch": 7, "tier": "进阶", "topic": "抵押贷款", "q": "抵押贷款例：为什么要控制职业、是否失业等变量，才能说种族有无歧视？", "a": "若遗漏与种族虚拟变量相关、又影响批准的特征，会给出**虚假的歧视证据**（遗漏变量偏误）。", "id": "fd6de745"}, {"ch": 7, "tier": "进阶", "topic": "控制不干净", "q": "观测数据下政策评价为什么总担心\"控制不干净\"？", "a": "可观测变量能控制，不可观测的（如能力、性格）控制不了；它们既影响是否进入处理组，又影响结果 ⇒ 内生性。需要工具变量、双重差分等方法（后面章节）。", "id": "f28887d5"}, {"ch": 7, "tier": "少见", "topic": "卡方证明思路", "q": "证明 $\\dfrac{(n-k-1)\\hat\\sigma^2}{\\sigma^2}\\sim\\chi^2_{n-k-1}$（MLR.1–6）的思路？", "a": "1. 左边 $=\\sum\\hat u_i^2/\\sigma^2$，但 $\\hat u_i$ 不独立（受 $\\sum\\hat u_i=0$ 等约束）。\n2. 把 $n$ 维空间分成**拟合空间**（$k+1$ 维）和**残差空间**（$n-k-1$ 维），两者垂直。\n3. 在残差空间取单位正交基 $a_1,\\dots,a_r$（$r=n-k-1$），令 $W_j=a_j'u/\\sigma$。\n4. $W_j$ **联合正态、均值 0、方差 1、两两不相关 ⇒ 独立标准正态**。\n5. 由 $a_j'\\hat u=a_j'u$，正交变换保持平方和：$SSR/\\sigma^2=\\sum W_j^2\\sim\\chi^2_{n-k-1}$。", "id": "63d6bdb7"}, {"ch": 7, "tier": "少见", "topic": "为什么独立", "q": "上一题证明里，为什么 $W_1,\\dots,W_r$ 独立？", "a": "$W_j=a_j'u/\\sigma$ 是正态的 $u_i$ 的线性组合，所以**联合正态**；而 $Cov(W_j,W_h)=a_j'a_h=0$（正交基）。**联合正态 + 两两不相关 ⇒ 独立。**", "id": "a14ca2ad"}, {"ch": 7, "tier": "少见", "topic": "自由度", "q": "为什么卡方的自由度是 $n-k-1$？", "a": "它是**残差空间的维数**：$n$ 维空间被 $k+1$ 个拟合方向（全 1 向量和各 $x_j$）占去，剩下 $n-(k+1)$ 个方向。", "id": "a8c240ee"}, {"ch": 7, "tier": "少见", "topic": "t与卡方", "q": "为什么 $\\hat\\beta_j$ 与 $\\hat\\sigma^2$ 独立有助于得到 t 分布？", "a": "$t=\\dfrac{(\\hat\\beta_j-\\beta_j)/sd(\\hat\\beta_j)}{\\sqrt{[SSR/\\sigma^2]/(n-k-1)}}$：分子是标准正态，分母是独立的 $\\chi^2_{n-k-1}$ 除以自由度再开方，所以 $t\\sim t_{n-k-1}$。", "id": "839313a0"}, {"ch": 7, "tier": "少见", "topic": "无截距", "q": "为什么可以用\"省略截距、两个组各放一个虚拟变量\"来避开陷阱？有什么不足？", "a": "此时每组有自己的\"截距\"，不再共线。不足：①更难检验组间系数之差；②$R^2$ 公式仅在含截距时有效。", "id": "be93ba04"}, {"ch": 7, "tier": "少见", "topic": "LPM故事", "q": "用 0-1 因变量做线性回归被审稿人要求换 logit/probit，老师怎么应对的？", "a": "换模型重跑，**结论仍然成立**。老师的经验：用线性模型都做显著了，换非线性模型八九不离十更显著。启示：LPM 展示主结论，probit/logit 做稳健性检验。", "id": "59e725d3"}, {"ch": 7, "tier": "少见", "topic": "单位变化(作业)", "q": "人均收入 $x$ 从\"元\"改成\"百元\"，截距和斜率怎么变？（助教讲评）", "a": "**截距不变**（$x=0$ 时的 $y$ 不变）；**斜率变成原来的 100 倍**（\"增加一个单位\"从 1 元变成 100 元）。规律：x 的数字乘 $c$ → 斜率除以 $c$；y 的数字乘 $c$ → 截距和斜率都乘 $c$。", "id": "c800c140"}];
</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>
<script>
(function(){
  var KEY='ecoflash.v1';
  var S={marks:{},ch:[],tier:[],st:'all',shuf:false,mode:'swipe'};
  try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){S.marks=s.marks||{};S.ch=s.ch||[];S.tier=s.tier||[];S.st=s.st||'all';S.shuf=!!s.shuf;S.mode=s.mode==='list'?'list':'swipe';}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({marks:S.marks,ch:S.ch,tier:S.tier,st:S.st,shuf:S.shuf,mode:S.mode}));}catch(e){}}
  var TCLS={'基础':'t1','进阶':'t2','少见':'t3'};
  var CHN={1:'绪论',2:'简单回归',3:'多元回归·估计',4:'多元回归·推断',5:'大样本',6:'进一步的问题',7:'虚拟变量'};
  var $=function(i){return document.getElementById(i)};
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function fmt(t){
    var keep=[];
    t=t.replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g,function(m){keep.push(esc(m));return '\u0001'+(keep.length-1)+'\u0001';});
    var lines=t.split('\n'),out=[],mode=null;
    function inl(x){return esc(x).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
    function close(){if(mode){out.push('</'+mode+'>');mode=null;}}
    lines.forEach(function(l){var m;
      if(mode&&/^\u0001\d+\u0001$/.test(l.trim())&&out.length){out[out.length-1]=out[out.length-1].replace(/<\/li>$/,'<div>'+l.trim()+'</div></li>');}
      else if((m=l.match(/^- (.*)/))){if(mode!=='ul'){close();out.push('<ul>');mode='ul';}out.push('<li>'+inl(m[1])+'</li>');}
      else if((m=l.match(/^\d+\. (.*)/))){if(mode!=='ol'){close();out.push('<ol>');mode='ol';}out.push('<li>'+inl(m[1])+'</li>');}
      else if(l.trim()){close();out.push('<p>'+inl(l)+'</p>');}
    });
    close();
    return out.join('').replace(/\u0001(\d+)\u0001/g,function(_,i){return keep[+i];});
  }
  function typeset(el){
    if(window.renderMathInElement&&el){try{renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}}
  }
  var mathPending=true;
  function mathReady(){typeset(document.body);}
  var tries=0,iv=setInterval(function(){if(window.renderMathInElement){clearInterval(iv);mathReady();}else if(++tries>80)clearInterval(iv);},200);

  /* ---------- filtering ---------- */
  function pass(c){
    if(S.ch.length&&S.ch.indexOf(c.ch)<0)return false;
    if(S.tier.length&&S.tier.indexOf(c.tier)<0)return false;
    var m=S.marks[c.id]||0;
    if(S.st==='unk'&&m===1)return false;
    if(S.st==='bad'&&m!==2)return false;
    if(S.st==='good'&&m!==1)return false;
    return true;
  }
  function shuffled(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  var byId={};CARDS.forEach(function(c){byId[c.id]=c;});

  /* ---------- progress ---------- */
  function updateProg(){
    var g=0;CARDS.forEach(function(c){if(S.marks[c.id]===1)g++;});
    $('prog').style.width=(100*g/CARDS.length)+'%';
    var n=(S.ch.length?1:0)+(S.tier.length?1:0)+(S.st!=='all'?1:0);
    var d=$('fdot');d.style.display=n?'block':'none';d.textContent=n;
  }

  /* ---------- swipe deck ---------- */
  var deck=[],idx=0,session={g:0,b:0,s:0},cur=null,revealed=false;
  function buildDeck(){
    var d=CARDS.filter(pass).map(function(c){return c.id;});
    deck=S.shuf?shuffled(d):d;idx=0;session={g:0,b:0,s:0};
    renderDeck();
  }
  function cardHTML(c){
    var m=S.marks[c.id]||0;
    return '<div class="bar '+TCLS[c.tier]+'"></div><div class="bigno">'+(c.ch<10?'0':'')+c.ch+'</div>'
      +'<div class="stamp g">会了</div><div class="stamp b">不熟</div>'
      +'<div class="cbody"><div class="meta"><span>第'+c.ch+'章 · '+CHN[c.ch]+'</span><span class="tag '+TCLS[c.tier]+'">'+c.tier+'</span><span>'+esc(c.topic)+'</span>'
      +(m?'<span class="badge m'+m+'">已标：'+(m===1?'会了':'不熟')+'</span>':'')+'</div>'
      +'<div class="sq">'+fmt(c.q)+'</div>'
      +'<div class="hintline">点一下卡片 · 翻看答案</div>'
      +'<div class="sa">'+fmt(c.a)+'</div></div>';
  }
  function renderDeck(){
    var stage=$('stage');cur=null;revealed=false;
    var total=deck.length;
    $('cnt').textContent=total?(Math.min(idx+1,total)+' / '+total):'0 / 0';
    $('mk').textContent='本轮  会了 '+session.g+' · 不熟 '+session.b;
    setCtrls(true);
    if(!total){
      stage.innerHTML='<div class="center"><h2>这里空空的</h2><p>当前筛选下没有卡片。点右上角调整章节、难度或状态。</p><div class="row"><button class="btn pri" data-a="openf">打开筛选</button></div></div>';
      setCtrls(false);updateProg();return;
    }
    if(idx>=total){
      stage.innerHTML='<div class="center"><h2>这一轮刷完了</h2><div class="stats3"><div><b>'+session.g+'</b><span>会了</span></div><div><b>'+session.b+'</b><span>不熟</span></div><div><b>'+session.s+'</b><span>跳过</span></div></div>'
        +'<div class="row">'+(session.b?'<button class="btn pri" data-a="bad">只刷不熟的</button>':'')+'<button class="btn'+(session.b?'':' pri')+'" data-a="again">再来一遍</button><button class="btn" data-a="openf">换题库</button></div></div>';
      setCtrls(false);updateProg();return;
    }
    var c=byId[deck[idx]];cur=c;
    stage.innerHTML='<div class="scard" id="scard">'+cardHTML(c)+'</div>';
    typeset($('scard'));
    $('bReveal').textContent='翻看答案';
    updateProg();
  }
  function setCtrls(on){$('ctrls').style.visibility=on?'visible':'hidden';}
  function reveal(force){
    var el=$('scard');if(!el||!cur)return;
    revealed=(typeof force==='boolean')?force:!revealed;
    el.classList.toggle('open',revealed);
    $('bReveal').textContent=revealed?'收起答案':'翻看答案';
    if(revealed){typeset(el);var b=el.querySelector('.cbody');setTimeout(function(){var sa=el.querySelector('.sa');if(sa&&b&&sa.getBoundingClientRect().bottom>b.getBoundingClientRect().bottom){b.scrollTo({top:sa.offsetTop-80,behavior:'smooth'});}},60);}
  }
  function advance(){idx++;renderDeck();}
  function mark(m,dir){
    var el=$('scard');if(!el||!cur)return;
    if(m===1){S.marks[cur.id]=1;session.g++;}else if(m===2){S.marks[cur.id]=2;session.b++;}else{session.s++;}
    save();
    el.classList.add('fly');el.style.transform='translateX('+(dir*(window.innerWidth||600))+'px) rotate('+(dir*14)+'deg)';
    if(m===0)el.style.transform='translateY(-60px) scale(.94)';
    setTimeout(advance,230);
  }
  function prev(){if(idx>0){idx--;renderDeck();}}

  /* gestures */
  var drag=null;
  $('stage').addEventListener('pointerdown',function(e){
    var el=$('scard');if(!el||!el.contains(e.target)||e.button>0)return;
    if(e.target.closest('a,button'))return;
    drag={x:e.clientX,y:e.clientY,dx:0,moved:false,id:e.pointerId,t:Date.now(),el:el};
  });
  $('stage').addEventListener('pointermove',function(e){
    if(!drag)return;
    var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.moved){
      if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.3){drag.moved=true;drag.el.classList.add('dragging');try{drag.el.setPointerCapture(drag.id);}catch(_){}}
      else return;
    }
    drag.dx=dx;
    drag.el.style.transform='translateX('+dx+'px) rotate('+(dx/22)+'deg)';
    var g=drag.el.querySelector('.stamp.g'),b=drag.el.querySelector('.stamp.b');
    var k=Math.min(1,Math.abs(dx)/110);
    if(g)g.style.opacity=dx>0?k:0;if(b)b.style.opacity=dx<0?k:0;
  });
  function endDrag(e,cancel){
    if(!drag)return;var d=drag;drag=null;
    var dx=d.dx,dt=Date.now()-d.t;
    if(d.moved){
      d.el.classList.remove('dragging');
      if(!cancel&&(Math.abs(dx)>110||(Math.abs(dx)>50&&Math.abs(dx)/dt>0.6))){mark(dx>0?1:2,dx>0?1:-1);return;}
      d.el.style.transition='transform .22s cubic-bezier(.2,.8,.2,1)';d.el.style.transform='';
      d.el.querySelectorAll('.stamp').forEach(function(s){s.style.opacity=0;});
      setTimeout(function(){if(d.el)d.el.style.transition='';},240);
    }else if(!cancel){
      var sel=window.getSelection&&String(window.getSelection());
      if(!sel)reveal();
    }
  }
  $('stage').addEventListener('pointerup',function(e){endDrag(e,false);});
  $('stage').addEventListener('pointercancel',function(e){endDrag(e,true);});
  $('stage').addEventListener('click',function(e){
    var a=e.target.closest('[data-a]');if(!a)return;var k=a.dataset.a;
    if(k==='openf')openSheet();
    else if(k==='again'){buildDeck();}
    else if(k==='bad'){S.st='bad';save();syncChips();buildDeck();}
  });
  $('bReveal').onclick=function(){reveal();};
  $('bGood').onclick=function(){mark(1,1);};
  $('bBad').onclick=function(){mark(2,-1);};
  $('bPrev').onclick=prev;
  document.addEventListener('keydown',function(e){
    if(S.mode!=='swipe'||$('sheet').classList.contains('on'))return;
    if(e.key===' '||e.key==='Enter'){e.preventDefault();reveal();}
    else if(e.key==='ArrowRight'){mark(1,1);}
    else if(e.key==='ArrowLeft'){mark(2,-1);}
    else if(e.key==='ArrowDown'){mark(0,1);}
    else if(e.key==='ArrowUp'){prev();}
  });

  /* ---------- list view ---------- */
  var open={};
  function renderList(){
    var v=CARDS.filter(pass);
    $('list').innerHTML=v.map(function(c){
      var m=S.marks[c.id]||0,o=!!open[c.id];
      return '<article class="lc '+TCLS[c.tier]+(o?' open':'')+'" data-id="'+c.id+'"><button class="qbtn"><div class="meta"><span>第'+c.ch+'章</span><span class="tag '+TCLS[c.tier]+'">'+c.tier+'</span><span>'+esc(c.topic)+'</span></div>'
        +'<div class="q">'+fmt(c.q)+'</div><div class="hint">点一下看答案</div></button>'
        +'<div class="a">'+fmt(c.a)+'<div class="marks"><button class="g" data-m="1" aria-pressed="'+(m===1)+'">✓ 会了</button><button class="b" data-m="2" aria-pressed="'+(m===2)+'">✗ 不熟</button></div></div></article>';
    }).join('')||'<div class="center"><p>没有符合条件的卡片</p></div>';
    typeset($('list'));
    var g=0;CARDS.forEach(function(c){if(S.marks[c.id]===1)g++;});
    $('stat').textContent='显示 '+v.length+'/'+CARDS.length+' · 已会 '+g;
    updateProg();
  }
  $('list').addEventListener('click',function(e){
    var card=e.target.closest('.lc');if(!card)return;
    var id=card.dataset.id,mb=e.target.closest('.marks button');
    if(mb){var m=+mb.dataset.m;if(S.marks[id]===m)delete S.marks[id];else S.marks[id]=m;save();
      var cur2=S.marks[id]||0;card.querySelectorAll('.marks button').forEach(function(b){b.setAttribute('aria-pressed',(+b.dataset.m)===cur2);});updateProg();
      var g=0;CARDS.forEach(function(c){if(S.marks[c.id]===1)g++;});var v=CARDS.filter(pass).length;$('stat').textContent='显示 '+v+'/'+CARDS.length+' · 已会 '+g;return;}
    if(e.target.closest('.qbtn')){var o=!card.classList.contains('open');card.classList.toggle('open',o);open[id]=o;}
  });
  function hideAll(){open={};document.querySelectorAll('.lc.open').forEach(function(c){c.classList.remove('open');});}
  $('hideAll').onclick=hideAll;$('fab').onclick=hideAll;
  $('showAll').onclick=function(){document.querySelectorAll('.lc:not(.open)').forEach(function(c){c.classList.add('open');open[c.dataset.id]=true;});};

  /* ---------- mode ---------- */
  function setMode(m,noSave){
    S.mode=m;if(!noSave)save();
    $('vSwipe').classList.toggle('on',m==='swipe');$('vList').classList.toggle('on',m==='list');
    $('tSwipe').setAttribute('aria-selected',m==='swipe');$('tList').setAttribute('aria-selected',m==='list');
    document.body.classList.toggle('list',m==='list');
    if(m==='list')renderList();else{renderDeck();}
  }
  $('tSwipe').onclick=function(){setMode('swipe');};
  $('tList').onclick=function(){setMode('list');};

  /* ---------- filter sheet ---------- */
  function mkChips(host,items,isOn,toggle){
    var h=$(host);h.innerHTML='';
    items.forEach(function(it){var b=document.createElement('button');b.className='chip';b.textContent=it.l;b._v=it.v;
      b.onclick=function(){toggle(it.v);save();syncChips();applyFilters();};h.appendChild(b);});
    return function(){h.querySelectorAll('.chip').forEach(function(b){b.setAttribute('aria-pressed',isOn(b._v));});};
  }
  var paints=[];
  paints.push(mkChips('gCh',[{l:'全部',v:0}].concat([1,2,3,4,5,6,7].map(function(n){return {l:'第'+n+'章',v:n};})),
    function(v){return v===0?!S.ch.length:S.ch.indexOf(v)>=0;},
    function(v){if(v===0)S.ch=[];else{var i=S.ch.indexOf(v);if(i>=0)S.ch.splice(i,1);else S.ch.push(v);}}));
  paints.push(mkChips('gTier',[{l:'全部',v:''},{l:'基础',v:'基础'},{l:'进阶',v:'进阶'},{l:'少见',v:'少见'}],
    function(v){return v===''?!S.tier.length:S.tier.indexOf(v)>=0;},
    function(v){if(v==='')S.tier=[];else{var i=S.tier.indexOf(v);if(i>=0)S.tier.splice(i,1);else S.tier.push(v);}}));
  paints.push(mkChips('gSt',[{l:'全部',v:'all'},{l:'没标记 + 不熟',v:'unk'},{l:'只看不熟',v:'bad'},{l:'只看已会',v:'good'}],
    function(v){return S.st===v;},function(v){S.st=v;}));
  function syncChips(){paints.forEach(function(p){p();});$('swShuf').setAttribute('aria-checked',S.shuf);
    $('ssub').textContent='当前题库 '+CARDS.filter(pass).length+' 张 / 共 '+CARDS.length+' 张';updateProg();}
  var applyT=null;
  function applyFilters(){clearTimeout(applyT);applyT=setTimeout(function(){if(S.mode==='swipe')buildDeck();else renderList();},120);}
  function openSheet(){syncChips();$('scrim').classList.add('on');$('sheet').classList.add('on');}
  function closeSheet(){$('scrim').classList.remove('on');$('sheet').classList.remove('on');}
  $('fbtn').onclick=openSheet;$('scrim').onclick=closeSheet;$('sdone').onclick=closeSheet;
  $('swShuf').onclick=function(){S.shuf=!S.shuf;save();syncChips();applyFilters();};
  $('resetMarks').onclick=function(){
    var b=this;if(!Object.keys(S.marks).length)return;
    if(b.dataset.arm==='1'){S.marks={};save();b.dataset.arm='0';b.textContent='清空全部标记';syncChips();applyFilters();return;}
    b.dataset.arm='1';b.textContent='再点一次确认清空';setTimeout(function(){b.dataset.arm='0';b.textContent='清空全部标记';},3000);
  };

  syncChips();
  buildDeck();
  setMode(S.mode,true);
})();
</script>

</body></html>
